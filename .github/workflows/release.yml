name: Release

# A release is a tag vX.Y.Z on main. Two jobs:
#   build-sign  reads the signing secrets, builds, signs, checks the signature
#               structure, the certificate fingerprint against the README and the
#               module version against the tag. It cannot write to the repository.
#   draft       can write to the repository, sees no secret and builds nothing:
#               it attaches the signed .modl and its SHA-256 to a DRAFT release.
# The workflow never publishes: the owner publishing the draft is the approval.
# See RELEASING.md.
#
# Secrets (Settings, Secrets and variables, Actions):
#   MODULE_SIGNING_KEYSTORE_B64       base64 of the PKCS12 keystore (alias "mapstudio")
#   MODULE_SIGNING_KEYSTORE_PASSWORD  its password

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-sign:
    name: Build and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing secrets live only in this environment, which needs the owner's approval (RELEASING.md).
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not vX.Y.Z. Ignition's module version is numeric, so prerelease suffixes are not allowed."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' is not on main. Release only from main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read the fingerprint from the README
        id: readme
        run: |
          line="$(grep -m1 '^Signing certificate SHA-256:' README.md || true)"
          fp="$(printf '%s' "$line" | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' || true)"
          if [ -z "$fp" ]; then
            echo "::error::README.md has no 'Signing certificate SHA-256:' fingerprint yet. The owner adds it before the first release."
            exit 1
          fi
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode the keystore
        env:
          KEYSTORE_B64: ${{ secrets.MODULE_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MODULE_SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing secret. Create MODULE_SIGNING_KEYSTORE_B64 and MODULE_SIGNING_KEYSTORE_PASSWORD (RELEASING.md)."
            exit 1
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mapstudio-signing.p12"

      - name: Build and sign
        env:
          MODULE_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.MODULE_SIGNING_KEYSTORE_PASSWORD }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: scripts/ci/build-signed.sh "$RUNNER_TEMP/mapstudio-signing.p12" mapstudio "$VERSION"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mapstudio-signing.p12"

      - name: Verify the signature structure, fingerprint and version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          FINGERPRINT: ${{ steps.readme.outputs.fingerprint }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          modl="$RUNNER_TEMP/out/Map-Studio-$VERSION.modl"
          cp build/Map-Studio.modl "$modl"
          scripts/ci/modl-verify.sh "$modl" "$FINGERPRINT" "$VERSION"
          (cd "$RUNNER_TEMP/out" && sha256sum "Map-Studio-$VERSION.modl" > "Map-Studio-$VERSION.modl.sha256")
          cat "$RUNNER_TEMP/out/Map-Studio-$VERSION.modl.sha256"

      - name: Upload the signed module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-modl
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 3

  draft:
    name: Draft the release
    needs: build-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the signed module
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-modl
          path: out

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build-sign.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Map Studio $VERSION" --generate-notes \
            "out/Map-Studio-$VERSION.modl" "out/Map-Studio-$VERSION.modl.sha256"
