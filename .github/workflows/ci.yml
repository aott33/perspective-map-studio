name: CI

# Builds and tests every push and pull request. Nothing here reads a secret: the
# module is built unsigned, and the signing path is checked with a throwaway
# certificate that is generated during the run and never stored.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'web/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # `build` runs the Java and Jest tests; a broken web bundle fails it.
      - name: Build and test
        run: ./gradlew build --no-daemon --console plain -Dorg.gradle.java.installations.auto-download=false

      - name: Upload the unsigned module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: map-studio-unsigned-modl
          path: build/Map-Studio.unsigned.modl
          if-no-files-found: error
          retention-days: 7

  signing-check:
    name: Signing check (throwaway certificate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'web/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Sign with a throwaway certificate and verify
        run: scripts/ci/test-signing.sh
