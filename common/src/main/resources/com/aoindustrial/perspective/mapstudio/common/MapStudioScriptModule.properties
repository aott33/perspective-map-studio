ping.desc=Answers with a short text and the Gateway time, to show that Map Studio's scripting module is loaded.
ping.returns=A string: "Map Studio pong at <ISO 8601 UTC time>".

getMap.desc=Returns the live map items of a project's map from the map store; deleted ones (tombstones) are left out. Gateway scope only: in the Designer it raises "runs in Gateway scope only". Raises an error starting with its code (invalid when no project is named, store-unreachable when the project has no Map Studio setup or the store is not ready).
getMap.param.project=The name of the Ignition project whose map to read. The project needs a Map Studio setup.
getMap.returns=A list of dicts, one per live map item: id, kind, name, geometry (GeoJSON Point or LineString, longitude first), properties, assetId, overrides, ends, attachment (an instrument's {lineId, distanceM} on its line, else None), version, deleted (False). The list also has two attributes: readOnly is None, or the reason the map cannot be saved on this Gateway (a newer map store schema, or a standby); kindSetups is the list of live kind setup records {kindId, setup, version, deleted}.

applyEdits.desc=Saves one batch of edits to a project's map through Map Studio's write service, all ops or none, recorded under the actor. The caller is trusted with full editing, like system.db: put your own role check in front of any script a user can start. Ops: create (baseVersion 0, or a deleted item's version to restore it), update (the stored version; data replaces only the top-level fields it carries), and delete (the stored version, no data), on entity item or kindSetup (id is the kind id, data is {"setup": {...}}). An item's data is kind, name, geometry, properties, assetId, overrides, ends and attachment (an instrument's {lineId, distanceM}); kind and geometry are required on create, and every item is checked against the project's kind list. Ids are UUIDs you make: use a UUIDv5 of a stable name (uuid.uuid5(uuid.NAMESPACE_URL, name)) so a re-run names the same items. A re-run that sends create at 0 for an id already stored is refused with conflict, not saved twice: read the stored version with getMap and send update at that version instead; a deleted item is not in getMap, so its create is refused with conflict and the conflict carries its version. A refusal raises a Java exception (catch java.lang.Throwable) whose message starts with its code: conflict (a stale baseVersion, a create on an existing id, or an update or delete of a deleted one), role, invalid (malformed batch, two ops on one id, an update of an id never saved, no actor, an item that breaks the kind list, or no kind list in use), read-only, store-unreachable (no setup, store not ready, or the Gateway busy). Nothing is written then. A conflict's exception also has conflicts(): a list of {index, entity, id, baseVersion, current, changedBy, changedAt}, where current is the stored record (current.deleted True for a deleted one); in a Gateway script each element reads like a dict, for example c['current']['deleted'] and c['current']['version']. Other refusals answer None. A batchId sent again by the same actor after it was saved is answered with the first reply. Gateway scope only.
applyEdits.param.project=The name of the Ignition project whose map to change. The project needs a Map Studio setup.
applyEdits.param.batch=A dict {"batchId": "<UUID>", "ops": [{"op": "create", "update" or "delete", "entity": "item" or "kindSetup", "id": "<UUID>" (a kind id for kindSetup), "baseVersion": 0 on create or the stored version, "data": {...} (none on delete)}]}, at most 1000 ops and one op per id.
applyEdits.param.actor=Who makes the change, recorded in the edit record (for example "seed-script"). Required: a blank actor is refused with invalid.
applyEdits.returns=A dict {"batchId", "seq", "results": [{"entity", "id", "version"}]}: seq is the project's change number this batch took, and each result is an op's id with its new version.

refreshAdapters.desc=Calls the kind function and the asset function a project's Map Studio setup names, now rather than at the next refresh interval, and returns the status of both lists. Waits for both calls to answer or time out (5 s each, at most 21 s in all). Call it after your own kind or asset data changed. Gateway scope only.
refreshAdapters.param.project=The name of the Ignition project whose lists to refresh. The project needs a Map Studio setup.
refreshAdapters.returns=A dict {"kinds": status, "assets": status}; each status is a dict {"status", "message", "function", "count", "left", "refreshedAt"} with status ok, empty, failing, slow, incomplete, not-configured or loading.
