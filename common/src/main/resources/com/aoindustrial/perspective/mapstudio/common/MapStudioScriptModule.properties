ping.desc=Answers with a short text and the Gateway time, to show that Map Studio's scripting module is loaded.
ping.returns=A string: "Map Studio pong at <ISO 8601 UTC time>".

getMap.desc=Returns the map items of a project's map from the map store, deleted ones left out. Gateway scope only.
getMap.param.project=The name of the Ignition project whose map to read. The project needs a Map Studio setup.
getMap.returns=A list of dicts, one per map item: id, kind, name, geometry (GeoJSON), properties, assetId, overrides, ends, version, deleted. The list's attribute readOnly is None, or the reason the map cannot be saved on this Gateway (a newer map store schema, or a standby).

applyEdits.desc=Saves one batch of edits to a project's map through Map Studio's write service, all ops or none, and records the actor. The caller is trusted with full editing. Raises an error starting with its code (conflict, role, invalid, store-unreachable, read-only) and writes nothing when the batch is refused. Gateway scope only.
applyEdits.param.project=The name of the Ignition project whose map to change. The project needs a Map Studio setup.
applyEdits.param.batch=A dict {"batchId": "<UUID>", "ops": [{"op": "create" or "update", "entity": "item", "id": "<UUID>", "baseVersion": 0 on create or the stored version, "data": {...}}]}.
applyEdits.param.actor=Who makes the change, recorded in the edit record (for example "seed-script"). Required.
applyEdits.returns=A dict {"batchId", "seq", "results": [{"entity", "id", "version"}]}.
