# Map Studio epics in build order. Table order is build order; ids are permanent.

[[epic]]
id = 1
slug = "epic-module-foundation"
title = "The module builds, signs and runs on a live Gateway"
description = "A signed Map Studio module from a GitHub release installs through the template's module lock and draws a MapLibre map on a Perspective view, with one event round trip; the spike's go is recorded with its measures."
covers = []

[[epic]]
id = 2
slug = "epic-map-store-and-data"
title = "The map, its kinds and assets live in the map store"
description = "A project names a database connection, kind list, asset list and editing roles; Map Studio creates its tables, saves edits as they happen, refuses unauthorised and conflicting saves, and records who changed what."
covers = ["R9", "R12", "R13", "R32", "R33", "R34"]
after = [{ epic = 1, needs = "the module skeleton, build and signing" }]

[[epic]]
id = 3
slug = "epic-viewing"
title = "Everyone reads live state from the map"
description = "Every user sees the one project map on a basemap, opened on its starting area: icons with comms, the icon KPI and alarms, lines with state, labels, search, popups with the alarm table and links, a legend and a Needs you summary, matching the template's current map."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R36", "R37", "R39", "R40", "R41", "R42", "R43"]
after = [{ epic = 2, needs = "map items, kinds and kind setups readable from the map store" }]

[[epic]]
id = 4
slug = "epic-editing"
title = "Map editors build and keep the map in the browser"
description = "Map editors enter Edit mode from an Edit switch or a prop into a docked studio with a grouped item list, draw and change points, lines and areas with snapping, Undo and Recent changes, fill item forms with the place check, link map items to assets, and write kind setups and overrides, with one clear mode and a first-run checklist."
covers = ["R10", "R11", "R14", "R15", "R16", "R17", "R18", "R19", "R20", "R21", "R22", "R23", "R24", "R38", "R40", "R41", "R44", "R45", "R46", "R47"]
after = [{ epic = 2, needs = "saving, roles and the asset list" }, { epic = 3, needs = "the map view to draw on" }]

[[epic]]
id = 5
slug = "epic-import-export"
title = "Integrators provision and move maps with files"
description = "Map editors download CSV templates, import CSV, KML and GeoJSON through a guided preview matched to assets, bulk edit shared properties of items selected in the list or by box or lasso, and export the map as GeoJSON or CSV; reference layers are deferred."
covers = ["R25", "R26", "R27", "R28", "R35"]
after = [{ epic = 4, needs = "map items, forms, linking and undo" }]

[[epic]]
id = 6
slug = "epic-phone"
title = "Operators fix map items from a phone"
description = "On a 390 px phone, touch only, a user with phone editing starts from Edit in the item's bottom sheet, moves a point with a fixed centre crosshair and edits its properties, with an Undo bar and no drawing tools."
covers = ["R30", "R31"]
after = [{ epic = 4, needs = "geometry edits, forms and undo" }]

[[epic]]
id = 7
slug = "epic-template-cutover"
title = "The template's map runs on Map Studio"
description = "The template's /map and /map/edit run on Map Studio with the Mesa field cut over into the map store; prov's map steps, ops.mapedit, the map_draft tables and the Leaflet map retire; generators, byte gates, the Edge example and the load harness follow; alarm presentation passes engineering review."
covers = []
after = [{ epic = 3, needs = "parity with today's map" }, { epic = 4, needs = "editing" }, { epic = 6, needs = "phone editing" }]
