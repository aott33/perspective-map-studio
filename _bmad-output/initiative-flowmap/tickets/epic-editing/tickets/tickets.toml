title = "Units: the setup's default and Edit mode's display setting for every distance the map shows"
description = "Owner, 2026-11-03 (R27): one units setting behind every distance Map Studio shows. The project setup gains units (auto, metric or us; default auto, the browser's locale, miles for en-US and kilometres otherwise), which takes the setup to schema 2 (an optional field; a schema 1 file still reads as auto; a schema 2 file is refused by a 0.3.0 Gateway as any newer schema is, docs/setup.md), with a Units row in the Designer form's Map section (epic 2 entry 16's form, which then reads schema 1 and 2 and writes 2) and docs/setup.md and setup-editor.md updated. The map store's project row gains settings (the next migration number) holding Edit mode's override, saved through edits.apply as a new entity settings with id units and data {system, labels} (labels short for symbols such as km and mi, long for words), full editing only, versioned like a kind setup, carried in map.load.reply and map.changed so every open map re-renders at once (added to contract 0.4.0). Edit mode's Layers surface gains a Units row (system: From setup, Metric, US; labels: Short, Long) saved on change. One formatter in the shared geometry module renders every distance from the setting: the line popup's length, instrument distances and segment span, the drawing bar's length, the typed distance along a line in Details (typed in the shown unit, stored in metres), Nearest to me, the Needs you rows and the phone move card, feet or metres under one unit. Nothing stored changes unit: the store keeps metres."
verify = "On the dev Gateway: with the setup at us the line popup reads 1.8 mi and PT-1 at 0.7 mi, the drawing bar counts in miles and a typed 3750 ft stores 1143 m; a schema 1 setup still loads and reads as auto; the Designer form shows the Units row and saves schema 2, and a 0.3.0 Gateway refuses that file in words; in Edit mode switching Units to Metric re-renders every distance in a second open browser without a reload and a viewer's map follows; Long labels read kilometres; a phone editor's or a viewer's settings save is refused role; an unknown system or label is refused in words; unit tests of the formatter and e2e pass."
