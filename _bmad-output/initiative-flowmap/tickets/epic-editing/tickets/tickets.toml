# Epic 4 stories in build order. Table order is build order; ids are permanent.
# Refined and planned 2026-11-03 (owner, "agree with all recommendations"); covers cite this epic's Requirements.
# Entry 1 splits the component first; entry 2 is the tracer bullet. Two lanes after it: the studio
# (4, 5, 9; 6, 12, 13; 7, 8; 10) and the page and place features (14, 15, 16); 11 reads the edit record.
# Entry 3 is the short UX update the new pieces wait on (8, 9, 11, 15, 16). Entry 2 bumps the contract to 0.4.0; 7, 11, 14, 15, 16 and 19 add to it.
# Entry 19 (units, owner 2026-11-03) follows 16 and precedes the sweep. Approved 2026-11-03; entry 1 started. 17 sweeps, 18 releases 0.4.0.
# Cross-epic prerequisites are pinned on the entries that need them ("2.n", "3.n").

[[entry]]
id = 1
type = "story"
title = "Opening refactor: the component split for the studio"
description = "Cleanup before the studio (owner, 2026-11-03): MapStudio.tsx holds the store delegate and the component in one 3,207-line file, and this epic adds a rail, a list, a properties panel, the Kinds screen, the tag browser, the draw toolbar, an undo stack and a Recent changes dock. Splits the delegate from the component into their own modules, lifts the View-mode controls' wiring and the map's drawing into named modules, and adds one mode and selection model (View or Edit, the current tool, the selected ids) that the studio's surfaces will read, with no change in behaviour: every e2e and unit test passes unchanged, the bundle stays within 2 percent of 0.3.0's size, and the contract is untouched. Scope is the split only; anything found that needs a feature goes to deferred-work.md."
verify = "The e2e suite and the web unit tests pass unchanged on the dev stack; the bundle size is within 2 percent of 0.3.0's; the contract docs and mapstudio.props.json are unchanged; MapStudio.tsx is under 800 lines and the delegate is its own module."
covers = []
after = ["3.13"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Tracer: Edit mode's docked studio, one pad added, linked, undone and seen by the page"
description = "The thinnest path through every layer editing touches (AD-2, AD-9, AD-10). First, a short live check on the dev 8.3 Gateway of three Perspective SDK claims (NFR-7), recorded in docs/platform-checks.md: a component event declared in the descriptor reaches a Perspective event script, a prop written by the component reaches a page binding, and whether the client store exposes the session props to a component. Then: the Edit switch top-right, shown only at level full, and the editMode prop made bidirectional (the switch writes it, a changed value switches the mode; a user without the role stays in View mode); the mode rail (View, Items, Kinds, Layers, the last two as empty surfaces until their stories); a first item list, every live item in one group with its state badge from the batch; the properties panel's Details tab with name, kind, the location row (typed latitude and longitude, which entry 5 uses and entry 6 completes with the place check, the flags and Zoom to location) and the asset picker (link and unlink; the linked item's icon and popup work at once), each field saving when finished through edits.apply; the floating toolbar with Select and a generic Point tool and the mode pill naming the mode; a point placed by a click then dragged to fine-tune; Undo and Redo in the panel header naming the step, over one undo stack per session that sends the reverse batch for a saved edit; the save status Saved and Saving...; and, as the SDK proof, the selectedItem prop written on selection with onItemSelected fired carrying the AD-7 object. As the first contract change it bumps the contract to 0.4.0 (CONTRACT_VERSION, the doc headers, CHANGELOG, the version check), which entries 7, 11, 14, 15 and 16 add to. Everything else (lines, snapping, the Style tab, the dock, the Kinds screen) is its own entry. The owner sees the studio run on the dev stack (a hitl step)."
verify = "On the dev Gateway as mapeditor at 1366 px: the Edit switch opens the studio and a viewer never sees it; a page with editMode true opens in Edit mode and writing the prop false returns to View mode; a pad added by a click, named and linked saves (map.changed in a second browser within a few seconds), its icon shows the kind setup's live values, and Undo removes it with the reverse batch saved; a Perspective event script on onItemSelected logs the clicked item and a label bound to selectedItem follows the selection; the three SDK checks are recorded in docs/platform-checks.md; the contract docs read 0.4.0 and the version check passes; e2e and unit tests pass."
covers = ["R17", "R20", "R21"]
after = [1, "2.3", "2.8", "3.14"]
hitl = true
risk = "high"

