# Epic 1 stories in build order. Table order is build order; ids are permanent.

[[entry]]
id = 1
type = "story"
title = "Tracer: a MapLibre map on a Perspective view, with one round trip"
description = "Scaffolds the module in Map Studio's own layout (modelled on Mustry's), builds it unsigned, installs it on the ops/ Docker dev Gateway, and shows an ao.mapstudio component drawing fixed test points and one line, with one envelope message to the delegate and back."
verify = "On the dev Gateway a Perspective view shows the map with three points and a line, and clicking a point logs the delegate's reply in the browser."
covers = ["R1", "R2"]
after = []
hitl = true
risk = "high"

[[entry]]
id = 2
type = "spike"
title = "MapLibre 6 and Terra Draw on the Perspective toolchain"
description = "Builds maplibre-gl 6.16.0 with terra-draw and its MapLibre adapter under React 16.14, TypeScript 4.9 and webpack 5 inside the component, and draws one line; if it fails, finds the newest MapLibre that works and pins it."
verify = "A line is drawn with Terra Draw on the tracer view, and the pinned MapLibre version is recorded with the reason."
covers = ["R3"]
after = [1]
hitl = false
risk = "high"

