[[entry]]
id = 16
type = "story"
title = "Setup form in the Designer: pickers and layout"
description = "Owner-approved 2026-10-27 after testing entry 7's form live (architecture AD-5): the setup stays a project resource edited in the Designer, not a Gateway page, so it belongs to the project, moves with export and git and is inherited. First a short live check on the dev 8.3 Gateway of how a Designer module asks the Gateway for lists (its RPC from the designer scope to the gateway scope, under whose rights, how fast), recorded in docs/platform-checks.md; entry 7 left these lookups out on purpose and they are unverified until then. Then entry 7's form gains: a dropdown of the Gateway's database connections (as Project Properties > Default Database lists them); role pickers from the project's identity provider for the full-editing and phone-editing roles; dropdowns of the project library's functions for kindsFunction and assetsFunction; a dropdown of the project's Perspective pages for alarmPage; checkboxes for the known basemaps none, osm, satellite and mapbox; a dropdown of the Gateway's secret providers plus a secret name for tokenSecret (names only: the Designer never reads, shows or logs a secret's value). A typed value stays allowed in every field, and a value not in a list (a connection or role not found, a list that fails to load) is kept and shown with a plain-words note, never cleared. Fields are grouped in sections \"Map store\", \"Who can edit\", \"Kinds and assets\" and \"Map\", at a sensible width, each with short help text, and the schema version is small read-only text. Follows Sally's Designer-style mockup (ux-map-studio/mockups) once the owner approves it. Validation stays the Gateway's setup reader (entry 7); docs/setup-editor.md updated with a screenshot. Designer scope and a read-only Gateway lookup only; no setup schema change beyond the secret provider (epic Notes, Assumption). Group D: beside the sweep (12), after 7."
verify = "docs/platform-checks.md records the live 8.3 Designer-to-Gateway lookup check; in a Designer on the dev project the owner opens Map Studio Setup, sees the four sections and the read-only schema version, picks the MapStudio connection, MapEditor and MapOperator from the identity provider's roles, the dev kind and asset functions, an alarm page, basemaps by checkbox and a secret provider with a typed secret name, also types a role that is not in the list and keeps it, saves, and map.load reflects the change; no secret value appears in the form, the Designer log or setup.json; Designer unit tests cover the lists, typed values and a lookup that fails."
covers = ["R12", "R18"]
after = [7]
hitl = true
risk = "medium"
unknown = "Does the owner approve Sally's Designer-style setup form mockup (ux-map-studio/mockups)?"

