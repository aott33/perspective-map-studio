# Epic 2 stories in build order. Table order is build order; ids are permanent.
# Parallel groups (epic Notes, Decision 2026-10-26): 1 alone; group A = 2 to 7 after 1;
# group B = 8, 9, 10 and 15 (added 2026-10-27, tag browse); group C = 11 and 14 (added 2026-10-27,
# instruments on lines); then 12 (sweep) with 16 beside it (added 2026-10-27, Designer setup form; the sweep does not wait on it),
# and 13 (closing release check) after both. Stories 2 to 7 are being built now: do not disturb them.

[[entry]]
id = 1
type = "story"
title = "Tracer: one edit saved through the write path and read back"
description = "Brings PostgreSQL back to the ops/ dev stack, reads the project setup resource at project start, creates the whole first mapstudio_ schema after waiting for the connection, and saves one map item edit through the write service from the browser (the spike's line tool) and from system.mapstudio.applyEdits, role-checked and recorded; map.load returns the stored map and the map draws it. Fixes the shared contracts: schema, message and op shapes, error codes, setup schema, per-batch seq with a no-op change hook. Group: alone, first."
verify = "On the dev Gateway a map editor draws a line, reloads, and the line is still there; a viewer's save is refused with code role; psql shows the item and an edit record naming the editor and the time."
covers = ["R1", "R3", "R4", "R12", "R13"]
after = ["1.1"]
hitl = true
risk = "high"
refine = true

[[entry]]
id = 2
type = "story"
title = "Conflicts, retries, deletes and the phone role"
description = "Completes the write service on entry 1's contract: a stale baseVersion refuses the whole batch with code conflict, a plain-words message and the other editor's current record; a retried batchId returns its first result; deletes are tombstones with a version bump that a later batch restores; the role matrix adds phone editing (a point's geometry and a map item's properties only) and map.load reports level phone. Gateway write service only. Group A."
verify = "Gateway tests and a live run show: two saves of one map item from two browsers, the second refused with the first's change; the same batchId sent twice writes once; a delete restored by a later batch; a phone editor's line refused with code role and a point move saved."
covers = ["R3", "R4", "R5"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Kind list and asset list from the project"
description = "Calls the kind and asset functions the setup names on a bounded pool with a timeout (getProjectScriptManager), caches both, refreshes on a timer and on demand, checks them against the published kind list and asset contract, and reports empty, failing, slow or incomplete lists in words in the Gateway log and in map.load. Adds a dev kind and asset adapter to the dev project, docs for both contracts and the two example adapters (UDT instances from the tag tree, a named-query wrapper) in Jython 2.7. Gateway adapter caller and map.load content; no write-path change. Group A."
verify = "map.load in the dev session carries the dev kinds and assets with status ok; emptying, breaking or slowing the dev adapter shows the matching plain-words status in map.load and one log line, without a Gateway restart."
covers = ["R8", "R10", "R14"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 15
type = "story"
title = "Tag browse and asset-relative paths for the tag browser"
description = "Owner-approved 2026-10-27, refined the same day (initiative R15; prd FR-12; architecture AD-8): the Gateway side of the tag browser, Map Studio's own tree with a tag provider dropdown (epic-editing), not Perspective's Tag Browse Tree component. First a short live check on the dev 8.3 Gateway of Ignition's tag browse API from the module's Gateway scope (which calls list the providers and find the Gateway's default, browse a folder of any provider, under whose permissions, how deep and how fast on a UDT instance), recorded in docs/platform-checks.md; the API is unverified until then. Then adds two message types to common/ and the delegate. tags.browse {provider, folder} is a general browse of any provider and folder (provider omitted is the Gateway's default, folder omitted or empty the provider's root), replying {provider, folder, providers: [{name, isDefault}], children: [{name, path, type, dataType, hasChildren}]}, each child with its full tag path. tags.resolve {kindId, assetId, path} converts a picked or typed tag path against the asset's base path from entry 3's cached asset list: a full path under the base path, or an {asset.path}/... path, replies {path: \"{asset.path}/...\", relative: true, n, m}, where m counts the kind's map items with a base path and n those it resolves for; any other full path replies {path (unchanged), relative: false}, for the browser's \"Same tag for every <kind>\" warning. Both for the full editing role only, checked on the Gateway (code role otherwise, phone editing included); an unknown provider, folder, asset or kind is refused with code invalid; reads tags, writes nothing; no migration. Docs for both messages (R14). Gateway and common/ only; no tree, dropdown, warning or Kinds screen. Group B (after 3)."
verify = "docs/platform-checks.md records the live 8.3 browse check; on the dev Gateway a full editor's tags.browse with no provider returns the providers with the Gateway's default marked and that provider's root, and a browse of a second provider and of a dev pad's asset folder (for example [default]Mesa/P12) lists children with name, full path, type and data type, a folder opening to its children; tags.resolve of a tag picked under that folder returns {asset.path}/... with resolves for N of M across the dev pads, one pad with the tag missing, and of a tag outside it returns the full path with relative false; a viewer's or phone editor's tags.browse or tags.resolve is refused with code role, and an unknown provider or folder with code invalid; Gateway tests cover the conversion, the count and the refusals."
covers = ["R17", "R14"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Saved edits reach every open map at once"
description = "Replaces entry 1's no-op change hook with one in-process change event per committed batch; every open map of the project, in any session, receives map.changed {seq, ops} at once and applies it; a seq gap makes the browser reload the map. Gateway change events and delegate fan-out plus the browser's map.changed handling. Group A."
verify = "With two browsers open on the dev view, a line saved in one appears in the other within a few seconds without a reload; a skipped seq in a Jest test triggers a reload."
covers = ["R6"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Map store operations: rights, failed and newer schemas, redundancy"
description = "Fills in the store states entry 1 defines: a role without CREATE or a failing migration logs one error naming the connection, statement and SQLState and leaves the store unavailable with no half-created schema; a schema newer than the module makes the map read only (saves refused, reason logged and in map.load); a standby Gateway in a redundant pair refuses writes. Adds docs/operations (backups through the site's PostgreSQL backups, rights, redundancy). Migrations and store state only. Group A."
verify = "On the dev stack a CONNECT-only role gives one error line and map.load reports the store unavailable; a schema version set above the module's gives read only; Gateway tests cover the failed migration rollback and the standby refusal."
covers = ["R2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Setup: validation, live change and docs"
description = "Validates the setup resource against its versioned schema with plain-words reasons for a missing, unreadable or invalid setup (store unavailable, reason in the log and in map.load); applies a changed setup without a Gateway restart through the lifecycle's resource-modified path (unverified in the spike, checked here live); documents the setup schema with an example. Setup loader and docs only. Group A."
verify = "Editing the dev project's setup file and rescanning the project changes the refresh interval and roles seen by map.load without a restart; a setup with a bad field gives a plain-words reason in the log and in map.load."
covers = ["R12", "R14"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Setup editor in the Designer"
description = "A Designer workspace for the setup resource, modelled on IA's project-resource example (about 300 lines of Swing, docs/platform-checks.md check 4): a form for every setup field with plain-words validation, saved as the same resource file. Designer scope only. The owner checks it in a Designer. Group A. Owner may drop it for AD-5's script-function fallback (epic Notes, Open question)."
verify = "In a Designer the owner creates and edits the dev project's setup through the form, saves, and the Gateway's map.load reflects the change."
covers = ["R12"]
after = [1]
hitl = true
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Unsaved edits survive and replay"
description = "The browser keeps unsent and refused batches in an ordered local-storage queue per project, replays them with their original versions and batchIds until saved or discarded, shows each as unsaved with its reason (a conflict names the other editor's change) and offers discard; when the map store is unreachable at load the map says so, draws no map item as current and turns editing off. Browser save client only. Group B (after 2 and 4)."
verify = "A line drawn while the dev Gateway is stopped shows as unsaved, survives closing the browser, and saves on reopen once the Gateway is back; a conflicting save shows its reason and can be discarded; an unreachable store at load shows the message and no items."
covers = ["R7", "R5"]
after = [2, 4]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "Kind setups in the map store, and items checked against the kind list"
description = "Publishes the kind setup schema (comms path, up to 4 KPIs with one icon KPI, alarms path, popup parts, popup link, custom popup view, a switch per live value) in common/ and docs; kindSetup ops (one versioned row per project and kind id) go through the write service and come back in map.load and getMap; every map item op is validated and normalised against the cached kind list (known kind, geometry, form-field types) and refused with code invalid and the reason. Owner-approved 2026-10-26 (initiative R40, architecture AD-16): the schema also carries the optional styleRule {source, type, cases, expression} and, for area kinds, areaTints {property, tints}, and a map item's overrides may hold its own styleRule; the write service stores them and refuses a preset or tint name outside the closed lists in common/, or a rule that does not match its type, with code invalid; nothing renders them here (epic-viewing). Owner-approved 2026-10-27 (initiative R8, R39; prd FR-5, FR-6, FR-37; architecture AD-7, AD-16): the custom popup view part is popupView {path, params}, each param a string literal or exactly one placeholder from the closed list published in common/ ({item.id}, {item.name}, {asset.id}, {asset.path}, {item.properties.X}), and the popup link uses the same placeholders; the view always receives mapItem, so no param may be named mapItem; a param may also be exactly {asset.path} followed by a tag path suffix, for example {asset.path}/Pressure (what a tag browser pick inside the asset folder gives; owner, 2026-10-27, answering question 17), accepted and resolved against the map item's asset base path, so the placeholder fill published in common/ gives [default]Mesa/P12/Pressure for pad P12; the write service refuses an unknown placeholder in a param or the link, any other mix of text and placeholders in a param or a param named mapItem with code invalid and the reason; stored and validated only, epic-viewing fills and renders them (per-item override, empty values and URL-encoding stay in the backlog). Owner-approved 2026-10-27 (the tag browser refined; initiative R15, R40; architecture AD-16): the popup link and the alarm page may mix text with any number of placeholders; every tag path in a kind setup (comms, KPIs, alarms, a style rule's value) is stored as an asset-relative {asset.path}/... path or a full tag path, and an override's tag path as a full tag path; the write service accepts both forms. Write service validation and kind setup storage. Group B (after 2 and 3)."
verify = "Gateway tests and a live run: a kind setup saved by applyEdits returns in map.load; an item of an unknown kind, of the wrong geometry or with a mistyped property is refused with a plain-words reason; a CSV-style string number is stored as a number. A kind setup with a States rule, a Bands rule and areaTints, and an item override with its own styleRule, return unchanged in map.load and getMap, and a preset or tint name outside the closed lists, or a colour code, is refused with code invalid and a plain-words reason. A kind setup with popupView {path: \"Popups/PadDetails\", params: {padName: \"{item.name}\", tagPath: \"{asset.path}\", area: \"Mesa\"}} and the link /pad/{item.name} returns unchanged in map.load and getMap; a param pressure {asset.path}/Pressure is accepted, returns unchanged, and the common/ placeholder fill resolves it to [default]Mesa/P12/Pressure for pad P12 (base path [default]Mesa/P12); an unknown placeholder such as {item.foo} in a param or in the link, a param mixing text and placeholders in another way such as P-{item.name} or {item.name}/Pressure, or a param named mapItem, is refused with code invalid and a plain-words reason. A kind setup with comms {asset.path}/Comms and a KPI on the full path [default]Shared/GasPrice, and an override with a full-path KPI, return unchanged in map.load and getMap."
covers = ["R8", "R11", "R14"]
after = [2, 3]
hitl = false
risk = "medium"

