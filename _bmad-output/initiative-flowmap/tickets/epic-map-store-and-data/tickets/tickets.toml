# Epic 2 stories in build order. Table order is build order; ids are permanent.
# Parallel groups (epic Notes, Decision 2026-10-26): 1 alone; group A = 2 to 7 after 1;
# group B = 8, 9, 10 and 15 (added 2026-10-27, tag browse); group C = 11 and 14 (added 2026-10-27,
# instruments on lines); then 12 (sweep) and 13 (closing release check). Stories 2 to 7 are being built now: do not disturb them.

[[entry]]
id = 1
type = "story"
title = "Tracer: one edit saved through the write path and read back"
description = "Brings PostgreSQL back to the ops/ dev stack, reads the project setup resource at project start, creates the whole first mapstudio_ schema after waiting for the connection, and saves one map item edit through the write service from the browser (the spike's line tool) and from system.mapstudio.applyEdits, role-checked and recorded; map.load returns the stored map and the map draws it. Fixes the shared contracts: schema, message and op shapes, error codes, setup schema, per-batch seq with a no-op change hook. Group: alone, first."
verify = "On the dev Gateway a map editor draws a line, reloads, and the line is still there; a viewer's save is refused with code role; psql shows the item and an edit record naming the editor and the time."
covers = ["R1", "R3", "R4", "R12", "R13"]
after = ["1.1"]
hitl = true
risk = "high"
refine = true

[[entry]]
id = 2
type = "story"
title = "Conflicts, retries, deletes and the phone role"
description = "Completes the write service on entry 1's contract: a stale baseVersion refuses the whole batch with code conflict, a plain-words message and the other editor's current record; a retried batchId returns its first result; deletes are tombstones with a version bump that a later batch restores; the role matrix adds phone editing (a point's geometry and a map item's properties only) and map.load reports level phone. Gateway write service only. Group A."
verify = "Gateway tests and a live run show: two saves of one map item from two browsers, the second refused with the first's change; the same batchId sent twice writes once; a delete restored by a later batch; a phone editor's line refused with code role and a point move saved."
covers = ["R3", "R4", "R5"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Kind list and asset list from the project"
description = "Calls the kind and asset functions the setup names on a bounded pool with a timeout (getProjectScriptManager), caches both, refreshes on a timer and on demand, checks them against the published kind list and asset contract, and reports empty, failing, slow or incomplete lists in words in the Gateway log and in map.load. Adds a dev kind and asset adapter to the dev project, docs for both contracts and the two example adapters (UDT instances from the tag tree, a named-query wrapper) in Jython 2.7. Gateway adapter caller and map.load content; no write-path change. Group A."
verify = "map.load in the dev session carries the dev kinds and assets with status ok; emptying, breaking or slowing the dev adapter shows the matching plain-words status in map.load and one log line, without a Gateway restart."
covers = ["R8", "R10", "R14"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 15
type = "story"
title = "Tag browse for the Kinds screen"
description = "Owner-approved 2026-10-27 (initiative R15; prd FR-12; architecture AD-8): the Gateway side of the Kinds screen's tag browser, which is Map Studio's own tree (epic-editing), not Perspective's Tag Browse Tree component. First a short live check on the dev 8.3 Gateway of Ignition's tag browse API from the module's Gateway scope (which call, under whose permissions, how deep and how fast on a UDT instance), recorded in docs/platform-checks.md; the API is unverified until then. Then adds tags.browse {assetId, folder, candidate} and its reply to the message types in common/ and the delegate: the Gateway browses the tag provider under the example asset's base path (and the folder below it) and replies with its children, each with name, type and data type; with a candidate relative path it also replies how many of the kind's M map items with a base path it resolves for (N), from entry 3's cached asset list. Full editing only, checked on the Gateway (code role otherwise); reads tags, writes nothing; no migration. Docs for the message (R14). Gateway and common/ only; no tree or Kinds screen. Group B (after 3)."
verify = "docs/platform-checks.md records the live 8.3 browse check; on the dev Gateway a full editor's tags.browse on a dev pad asset lists its tags with name, type and data type, a folder opens to its children, and a candidate path reports resolves for N of M across the dev pads, one pad with the tag missing; a viewer's or phone editor's tags.browse is refused with code role; Gateway tests cover the count and the refusal."
covers = ["R17", "R14"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Saved edits reach every open map at once"
description = "Replaces entry 1's no-op change hook with one in-process change event per committed batch; every open map of the project, in any session, receives map.changed {seq, ops} at once and applies it; a seq gap makes the browser reload the map. Gateway change events and delegate fan-out plus the browser's map.changed handling. Group A."
verify = "With two browsers open on the dev view, a line saved in one appears in the other within a few seconds without a reload; a skipped seq in a Jest test triggers a reload."
covers = ["R6"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Map store operations: rights, failed and newer schemas, redundancy"
description = "Fills in the store states entry 1 defines: a role without CREATE or a failing migration logs one error naming the connection, statement and SQLState and leaves the store unavailable with no half-created schema; a schema newer than the module makes the map read only (saves refused, reason logged and in map.load); a standby Gateway in a redundant pair refuses writes. Adds docs/operations (backups through the site's PostgreSQL backups, rights, redundancy). Migrations and store state only. Group A."
verify = "On the dev stack a CONNECT-only role gives one error line and map.load reports the store unavailable; a schema version set above the module's gives read only; Gateway tests cover the failed migration rollback and the standby refusal."
covers = ["R2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Setup: validation, live change and docs"
description = "Validates the setup resource against its versioned schema with plain-words reasons for a missing, unreadable or invalid setup (store unavailable, reason in the log and in map.load); applies a changed setup without a Gateway restart through the lifecycle's resource-modified path (unverified in the spike, checked here live); documents the setup schema with an example. Setup loader and docs only. Group A."
verify = "Editing the dev project's setup file and rescanning the project changes the refresh interval and roles seen by map.load without a restart; a setup with a bad field gives a plain-words reason in the log and in map.load."
covers = ["R12", "R14"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Setup editor in the Designer"
description = "A Designer workspace for the setup resource, modelled on IA's project-resource example (about 300 lines of Swing, docs/platform-checks.md check 4): a form for every setup field with plain-words validation, saved as the same resource file. Designer scope only. The owner checks it in a Designer. Group A. Owner may drop it for AD-5's script-function fallback (epic Notes, Open question)."
verify = "In a Designer the owner creates and edits the dev project's setup through the form, saves, and the Gateway's map.load reflects the change."
covers = ["R12"]
after = [1]
hitl = true
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Unsaved edits survive and replay"
description = "The browser keeps unsent and refused batches in an ordered local-storage queue per project, replays them with their original versions and batchIds until saved or discarded, shows each as unsaved with its reason (a conflict names the other editor's change) and offers discard; when the map store is unreachable at load the map says so, draws no map item as current and turns editing off. Browser save client only. Group B (after 2 and 4)."
verify = "A line drawn while the dev Gateway is stopped shows as unsaved, survives closing the browser, and saves on reopen once the Gateway is back; a conflicting save shows its reason and can be discarded; an unreachable store at load shows the message and no items."
covers = ["R7", "R5"]
after = [2, 4]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "Kind setups in the map store, and items checked against the kind list"
description = "Publishes the kind setup schema (comms path, up to 4 KPIs with one icon KPI, alarms path, popup parts, popup link, custom popup view, a switch per live value) in common/ and docs; kindSetup ops (one versioned row per project and kind id) go through the write service and come back in map.load and getMap; every map item op is validated and normalised against the cached kind list (known kind, geometry, form-field types) and refused with code invalid and the reason. Owner-approved 2026-10-26 (initiative R40, architecture AD-16): the schema also carries the optional styleRule {source, type, cases, expression} and, for area kinds, areaTints {property, tints}, and a map item's overrides may hold its own styleRule; the write service stores them and refuses a preset or tint name outside the closed lists in common/, or a rule that does not match its type, with code invalid; nothing renders them here (epic-viewing). Owner-approved 2026-10-27 (initiative R8, R39; prd FR-5, FR-6, FR-37; architecture AD-7, AD-16): the custom popup view part is popupView {path, params}, each param a string literal or exactly one placeholder from the closed list published in common/ ({item.id}, {item.name}, {asset.id}, {asset.path}, {item.properties.X}), and the popup link uses the same placeholders; the view always receives mapItem, so no param may be named mapItem; the write service refuses an unknown placeholder in a param or the link, a malformed param or a param named mapItem with code invalid and the reason; stored and validated only, epic-viewing fills and renders them (per-item override, empty values and URL-encoding stay in the backlog). Write service validation and kind setup storage. Group B (after 2 and 3)."
verify = "Gateway tests and a live run: a kind setup saved by applyEdits returns in map.load; an item of an unknown kind, of the wrong geometry or with a mistyped property is refused with a plain-words reason; a CSV-style string number is stored as a number. A kind setup with a States rule, a Bands rule and areaTints, and an item override with its own styleRule, return unchanged in map.load and getMap, and a preset or tint name outside the closed lists, or a colour code, is refused with code invalid and a plain-words reason. A kind setup with popupView {path: \"Popups/PadDetails\", params: {padName: \"{item.name}\", tagPath: \"{asset.path}\", area: \"Mesa\"}} and the link /pad/{item.name} returns unchanged in map.load and getMap; an unknown placeholder such as {item.foo} in a param or in the link, or a param named mapItem, is refused with code invalid and a plain-words reason."
covers = ["R8", "R11", "R14"]
after = [2, 3]
hitl = false
risk = "medium"

[[entry]]
id = 10
type = "story"
title = "Core oil and gas icon set"
description = "Ships the seventeen FR-9 icons (sixteen plus the instrument meter, a flow meter on a line, added 2026-10-27 with initiative R41; its glyph is new and distinct from meter station) in one minimalist style as a sprite the module serves, with their source, licence and attribution in NOTICE, nothing derived from OpenBridge, and an icon catalogue in common/ that the kind list's icon names are checked against (an unknown name reported in the adapter status). The owner approves the look. Static assets, the catalogue and the adapter check only; epic-viewing draws them. Group B (after 3)."
verify = "The sprite and catalogue are served by the dev Gateway, a docs page shows all seventeen icons, NOTICE carries their licence, and a dev kind naming an unknown icon is reported in map.load."
covers = ["R9"]
after = [3]
hitl = true
risk = "medium"

[[entry]]
id = 11
type = "story"
title = "Scripting API documented, and the 30-pad set seeded through it"
description = "Documents system.mapstudio.getMap and applyEdits (arguments, results, errors, the actor rule, UUIDv5 ids from a stable name and the re-run rule) with autocomplete docs in the Designer; a dev-project script seeds the 30-pad stand-in and the tracer's points through applyEdits, safe to re-run; removes the testSet prop, its stand-in data and the Scale view, and moves the e2e scale, measures and tracer specs onto store data. Group C (after 8 and 9)."
verify = "Running the seed script twice leaves exactly 30 pads and 30 lines in the map store; the e2e suite passes with testSet gone and the frame-rate measure still runs on the 30-pad set."
covers = ["R13", "R14", "R15"]
after = [8, 9, "1.7"]
hitl = false
risk = "medium"

[[entry]]
id = 14
type = "story"
title = "Instruments on lines: attachment stored and kept on the line"
description = "Owner-approved 2026-10-27 (initiative R41; prd FR-40; architecture AD-16, AD-19, AD-20). Adds attachment {lineId, distanceM} to the map item record (the next migration number, per the epic's migration rule) and instrument: true on point kinds to the kind list contract; the write service validates an attachment (instrument kind only, a live line item, distanceM from 0 to the line's geodesic length within 1 m) and refuses with code invalid a batch that changes or deletes a line without updating or deleting every instrument attached to it; deleting a line deletes its instruments in the same batch, and undoing it restores both in one step (owner, 2026-10-27); the shared geometry module in web/ gains the projection that recomputes each attached instrument's distanceM and point on a line's new geometry (move, reshape, vertex insert or delete, split), sent in the same edits.apply batch as the line; a line kind's styleRule may take source {instruments: \"worst\"}, refused on other kinds; map.load and getMap return attachments; docs for the record, kind list and kind setup schema updated. Stores and validates only: no drawing, popup or tool (epic-viewing entry 2, epic-editing). Group C (after 2 and 9); stories 2 to 7, being built now, are not disturbed."
verify = "Gateway tests and a live run: an instrument saved on a line with its distanceM returns unchanged in map.load and getMap; an attachment on a non-instrument kind, to a deleted or missing line, or past the line's end is refused with code invalid and a plain-words reason; a batch that reshapes or deletes a line without its instruments is refused; Jest tests of the shared geometry module turn a move, a reshape and a split of L-SWD-like test data (PT-1 at 1,143 m, PT-2 at 2,841 m of 2,922 m) into one batch that keeps each instrument on the line at its nearest place, saved all or none and undone as one step; deleting a line deletes its instruments in the same batch and one undo restores the line and its instruments; an instrument changed by another editor meanwhile makes the line's batch a conflict; an instruments style source on a point kind is refused."
covers = ["R16"]
after = [2, 9]
hitl = false
risk = "medium"

