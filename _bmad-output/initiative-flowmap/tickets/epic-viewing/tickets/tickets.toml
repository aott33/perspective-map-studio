# Epic 3 stories in build order. Table order is build order; ids are permanent.
# Refined 2026-10-28 (owner, "agree with all"); covers now cite this epic's Requirements.
# Entry 4 (release tooling, built) stays first. Entry 5 is the tracer bullet. One lane through the browser map
# (5, 6, 7, then 1, 2, 8, 9, 3); entry 1's Gateway part and entry 6 can run beside each other, as can 8 and 9.
# ER-27 steps of entries 1 to 3 moved to entry 12, one review before the release (owner, 2026-10-28).

[[entry]]
id = 4
type = "story"
title = "Shorter release checks: a smoke script, perf by measure and checks matched to the release type"
description = "Owner-approved 2026-10-28, after release 0.2.0, whose rehearsal repeated what CI already does (the template's whole local.sh and full test stack) and ran twice (throwaway-signed before the tag, published after). Matches the checks to the release type, written into RELEASING.md: every pull request runs Map Studio CI as now; before a minor release's tag, one rehearsal on the template's test stack with a throwaway-signed build, and the performance run only when the write path, the map store or the bundle changed; after every tag (and for a patch release) a short smoke; the template pull request relies on the template's own CI (local.sh, stack.yml) instead of repeating it. Adds ops/release-smoke.sh <version>: the template's module lock entry checked (SHA-256 against the release, certificate against the README fingerprint, modl-verify.sh), the template's Gateway image with a database only (no field simulator, broker or feedback stub), the module ACTIVE at that version, one save seen in a second browser, and mapstudio_schema_version.module_version equal to the version, from committed browser checks in e2e/rehearsal/ (no scratch scripts rewritten per release). Adds ops/perf.sh --only <measures> to run the named measures and compare them with the last record (docs/perf/). Never: edits ign-scada-template, commits a .modl, password, token or scratch project, or weakens a check CI runs."
verify = "ops/release-smoke.sh 0.2.0 passes against the published v0.2.0 in about 15 minutes and fails on a wrong SHA-256, a wrong certificate fingerprint and a module_version that does not match; ops/perf.sh --only edits.apply runs only those measures and prints the comparison with docs/perf/0.2.0-dev.json; RELEASING.md holds the table of checks by release type; Map Studio CI is unchanged and green."
covers = []
after = []
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Tracer: live values reach an icon and its default popup"
description = "The thinnest path through every layer viewing touches (AD-6, AD-7, AD-16). On the Gateway, one subscription per project to the comms, KPI and Alarm Metrics paths that seeded kind setups turn on, asset-relative {asset.path}/... paths resolved from each map item's base path and full paths taken as one tag for every item, LiveValue {value, quality, t, stale, reason} slots with stale computed from quality and comms, unresolved paths reported per map item; values.batch {seq, full, items} to each open map once per refresh interval (changes only, full on open and reconnect); popup.open and popup.close with the item's values pushed on change while open. In the browser, a point draws its kind's glyph, comms state (the comms-lost glyph and word in the new comms-lost theme token, owner 2026-10-28), the icon KPI and the alarm glyph with digit, solid or hollow by acknowledgement, normal neutral grey; a click opens the default popup in order header, comms with data age, 2 to 3 KPIs, alarms, stale values marked. Seeds dev kind setups and simulator tags on the dev stack (a hitl step if the owner's tags are wanted). Replaces e2e/lib/valueBatch.mjs's stand-in with the real message and adds both to the contract docs."
verify = "On the dev Gateway with seeded kind setups: toggling a dev tag changes an icon's KPI within one refresh interval; raising an alarm under the asset's Alarm Metrics draws the priority glyph and digit, acknowledging it turns it hollow; breaking comms draws the comms-lost glyph, word and token; a click opens the popup in the stated order and its KPI updates while open; Gateway logs show one subscription per path whatever the number of open sessions; e2e and unit tests pass."
covers = ["R2", "R6"]
after = ["2.9", "2.3", "2.11"]
hitl = true
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Basemaps and the starting area"
description = "None, OpenStreetMap and Satellite from the setup's basemaps (AD-12), switched in View mode, each with its provider's attribution always shown; with none, items draw on a blank background; the Satellite token read only from the secret the setup names, refused when it is not a public restricted token, never logged; docs/setup.md notes OpenStreetMap's tile usage policy for client sites. The component's starting area prop (centre and zoom, or bounds) replaces START_VIEW; two components with different starting areas show the same map items."
verify = "On the dev Gateway: each basemap draws with its attribution, None draws a blank background; a component given another starting area opens there and shows the same items as the first; no token appears in the browser's storage or the Gateway log; e2e at 1440 and 390 px pass."
covers = ["R1", "R10"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Labels, lines and the template's map parity"
description = "First, the map marker's info cleaned up (owner, 2026-10-28, on entry 5's marker): entry 5 bakes the icon KPI and the state words into each marker image (no glyph source), so they never give way, carry no halo and crowd neighbours (\"950 psi\", \"Stale - No value\", \"Comms lost\" overlapping at 390 px); a glyph source is added and the marker follows DESIGN.md's map marker: the disc with the kind glyph and the state glyph top-right in the image, and the name below with the state word chip beside it and the icon KPI as real text labels in map-label and state-word type with a halo, which collide and give way. Build from the UX review _bmad-output/initiative-flowmap/ux-map-studio/review-popup-and-marker-info.md (2026-10-28), items M1 to M5, with the owner's answers to its proposed decisions (D1 to D5 agreed 2026-10-28, epic Notes). Then the template's docs/map.md section 5 list, item by item: labels ranked by the kind list that give way as the user zooms out and never overlap at the starting zoom, names from zoom 14, normal items as dots below zoom 12 with abnormal glyphs kept; line weight by pipe size, line hue only from alarms with the glyph at the midpoint, dashed for no data or comms lost, thin neutral with no instruments; the flow arrow on the selected line only; items within 20 m as one shared marker opening a pick list; Fit and Return (Return disabled with nothing selected); a tap on the ground clears the selection; Fit keeps until the bounds change. A checklist in docs/ maps each section 5 item to met or listed for ER-27 (the template's chip row and top sheets are the listed departure)."
verify = "On the dev 30-pad set: no marker text overlaps another marker's at 1440 or 390 px and each reads over a basemap by its halo; zooming out thins labels with no overlap at the starting zoom; two items 15 m apart show one marker whose pick list opens both; Fit, Return and the ground tap behave as listed; the flow arrow shows only on the selected line; the checklist has every section 5 item marked met or for ER-27; e2e passes."
covers = ["R3", "R5"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
id = 1
type = "story"
title = "Value-driven styles and area category tints drawn from live values"
description = "Initiative R40 (owner, 2026-10-26; prd FR-38, FR-39; architecture AD-11, AD-16). First a live 8.3 check: can module code evaluate an Ignition expression against a map item's values (recorded in docs/platform-checks.md and architecture AD-16; if not, the expression type goes to the backlog and States and Bands ship, owner 2026-10-28). Works out each map item's style rule on the Gateway in the shared live-value cache (owner, 2026-10-28): the rule's source value is one more slot of the shared subscription, States, Bands or the expression pick a preset, and values.batch carries the preset name; and points, lines and areas draw it from the closed preset list in common/ (theme token plus glyph or word for attention, warning and fault; dimmed; solid, dashed, dotted and weight by pipe size for lines); alarm state draws over a value style, both over an area's category tint from the low-saturation palette; a stale source value draws only as stale, dropping the last value style until a fresh value arrives; per-item overrides apply. Ships the preview component the kind setup screen embeds, drawing every state or band in its preset before saving (the screen and its rule editing are epic-editing's, R15, R16), and the docs page of every preset and tint in both themes, which entry 12 takes to the engineering review (ER-27)."
verify = "On the dev Gateway with seeded kind setups: a States rule and a Bands rule change an icon's and a line's look as the source tag changes, within one refresh interval; an active alarm draws over the value style; a stale source value drops the style and shows stale until a fresh value arrives; an area takes its category tint and a point never does; the preview shows every state in its preset; no colour literal is in the stored rules or the module's styles; the expression check is recorded in docs/platform-checks.md."
covers = ["R12"]
after = ["2.9", 5]
hitl = false
risk = "medium"

[[entry]]
