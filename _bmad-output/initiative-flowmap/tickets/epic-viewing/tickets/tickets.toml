description = "Owner, 2026-10-28, after entry 7's renders: entries 5 to 7 each added a control on the right with its own look (zoom, a Fit and Return pill, the basemap switch, the spike's Draw a line). View mode is arranged as DESIGN.md (View mode, Phone, zoom-control) and the mockups (key-screen-1-view-desktop-popup.png, key-screen-2-phone-sheet.png) show it: one zoom card top-right with plus, the zoom level (\"z 15\"), minus, Fit and Return (an icon, disabled with nothing selected), one rounded card with the soft floating shadow, 44 px targets at 390 px; a Legend button bottom-left with the scale bar beside it, opening a panel that holds the basemap choice (None, OpenStreetMap, Satellite from the setup; owner 2026-10-28: viewers never reach Edit mode's Layers rail, which keeps its own switch when epic-editing builds it); entry 3 fills the same panel with the glyph key and the Lines and Names toggles; the spike's Draw a line leaves View mode and stays only on the dev editing page until epic-editing replaces it; nothing in the bottom-right corner; theme tokens only. Updates the screenshots and EXPERIENCE.md-facing docs (docs/basemaps.md) for the new place of the basemap choice."
