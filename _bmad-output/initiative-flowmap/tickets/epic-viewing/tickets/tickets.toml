[[entry]]
id = 2
type = "story"
title = "Instruments drawn on lines, the ordered line popup, segment click and the aggregate line style"
description = "Initiative R41 (owner, 2026-10-27; prd FR-4, FR-5, FR-34, FR-38, FR-40; architecture AD-7, AD-11, AD-16, AD-19). Draws each instrument (tap, meter, line valve) as its kind's icon at its place on its line, from the stored attachment, and splits the line into line segments for display; a line's default popup lists its instruments in order along the line, between the map items its ends snap to, each with its live values and distance (for example CTB1 outlet, PT-1 at 1.1 km, PT-2 at 2.8 km, SWD1 inlet), plus the line's own KPIs and alarm summary, with the Gateway pushing every listed instrument's values while it is open; a click or tap on a line opens the popup at that segment (for example PT-1 to PT-2) with the instruments at its ends highlighted on the map and in the list, on desktop and as a bottom sheet at 390 px; an instrument's alarm glyph draws at its place on the line, the line's own alarms keeping the midpoint glyph; a line style rule with the instruments source draws each line segment from the worst of the instruments at the segment's ends (owner, 2026-10-27, as the template's map does): dashed when either end instrument is stale, otherwise the worse of their presets, alarm state still winning; the map item object of a line carries its ordered instruments and the open segment for custom popup views. The segment look is worked out on the Gateway where style rules are (R12). Instrument alarms and the aggregate look go to entry 12's engineering review (ER-27)."
verify = "On the dev Gateway with a seeded L-SWD-like line (PT-1 at 1,143 m, PT-2 at 2,841 m of 2,922 m, ends snapped to CTB1 and SWD1): the instruments draw at their places; the line popup lists CTB1 outlet, PT-1, PT-2, SWD1 inlet in order with live values that update while open; a click between PT-1 and PT-2 opens it at \"PT-1 to PT-2\" with both highlighted; an alarm on PT-2 draws at PT-2's place on the line; with the instruments style source, making PT-1 stale dashes the segments CTB1 to PT-1 and PT-1 to PT-2 only, and pushing PT-2 outside its band shows attention on PT-1 to PT-2 and PT-2 to SWD1 only, an active alarm drawing over both; the same at 390 px."
covers = ["R13"]
after = ["2.14", 1]
hitl = false
risk = "medium"

