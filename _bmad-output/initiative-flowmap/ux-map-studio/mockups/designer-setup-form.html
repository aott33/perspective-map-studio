<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Designer Setup Form</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Mono&display=swap">
<style>
/* Map Studio Setup form in the Ignition 8.3 Designer (light theme).
   Swing stand-ins: every colour below maps to a UIManager key named in DESIGN.md
   (designer-* tokens). The Swing form reads the keys; these hex values are only the
   mock's stand-ins for the Designer's light theme. Render one state with ?v=STATE:
   normal, reasons, unreachable, inherited, newer, picker, empty, new.
   There is no create dialog: empty and new are the same tab.
   No section list (owner, 2026-10-27): the tab body is the form alone, left aligned.
   Quiet form (owner, 2026-10-27): no help line under fields (each label has a tooltip;
   normal draws the Phone-editing roles one open), marks only on problems, one Refresh
   lists link in the header, footer only when it has something to say, the placeholder
   is the Alarm page list's last item. */
:root {
  --d-panel: #f2f3f5;          /* Panel.background */
  --d-surface: #ffffff;        /* TextField.background, Tree.background */
  --d-border: #c4c7cc;         /* Component.borderColor */
  --d-divider: #dcdfe3;        /* Separator.foreground */
  --d-text: #1f2328;           /* Label.foreground */
  --d-text-2: #6a7078;         /* Label.disabledForeground: schema version, placeholders, the one note */
  --d-accent: #2675bf;         /* Component.accentColor: focus, checkbox, selection */
  --d-accent-tint: #dce9f7;    /* List.selectionBackground (inactive) */
  --d-error: #c62a36;          /* Component.error.focusedBorderColor */
  --d-warning: #a86400;        /* Component.warning.focusedBorderColor, darkened for text */
  --d-warning-edge: #e2a53a;   /* Component.warning.borderColor */
  --d-tip: #fbfbfc;            /* ToolTip.background */
  --d-tip-text: #1f2328;       /* ToolTip.foreground */
  --d-tip-border: #a9aeb5;     /* ToolTip.border (line colour) */
  --d-info-tint: #e8f1fb;      /* banner background: accent at about 10 % */
  --d-warning-tint: #fdf3e2;   /* banner background: warning at about 12 % */
  --d-chip: #e7e9ec;           /* chip fill: Button.background */
  --d-disabled: #f7f8f9;       /* TextField.disabledBackground */
  --font: 'Noto Sans', 'DejaVu Sans', sans-serif;
  --mono: 'Noto Sans Mono', 'DejaVu Sans Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--d-panel); color: var(--d-text); font: 13px/1.35 var(--font); overflow: hidden; }
.app { width: 1440px; height: 900px; display: grid; grid-template-rows: 26px 34px 1fr 24px; }
.menubar { display: flex; gap: 2px; align-items: center; padding: 0 6px; background: var(--d-surface); border-bottom: 1px solid var(--d-divider); }
.menubar span { padding: 3px 9px; }
.toolbar { display: flex; gap: 4px; align-items: center; padding: 0 8px; border-bottom: 1px solid var(--d-divider); }
.tb { width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; color: var(--d-text-2); }
.tb.sep { width: 1px; height: 18px; background: var(--d-divider); margin: 0 4px; border-radius: 0; }
.main { display: grid; grid-template-columns: 264px 1fr; min-height: 0; }
.browser { background: var(--d-surface); border-right: 1px solid var(--d-divider); display: flex; flex-direction: column; min-height: 0; }
.dock-title { height: 28px; display: flex; align-items: center; padding: 0 10px; font-weight: 600; border-bottom: 1px solid var(--d-divider); background: var(--d-panel); }
.tree { padding: 6px 0; }
.tree div { height: 22px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tree .sel { background: var(--d-accent); color: #fff; }
.tree .sel svg { color: #fff; }
.tree .inh { color: var(--d-text-2); font-style: italic; font-size: 12px; }
.tree .sel .inh { color: #e6eefa; }
.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { height: 30px; display: flex; align-items: flex-end; padding-left: 6px; border-bottom: 1px solid var(--d-divider); }
.tab { height: 30px; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: var(--d-surface); border: 1px solid var(--d-divider); border-bottom: 2px solid var(--d-accent); border-top-left-radius: 3px; border-top-right-radius: 3px; }
.tab .x { color: var(--d-text-2); }
.tabbody { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--d-surface); }
.formwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; overflow: hidden; position: relative; padding: 14px 24px 0 24px; }
.scrollbar { position: absolute; right: 2px; top: 4px; width: 8px; height: 82%; border-radius: 4px; background: #cfd3d8; display: none; }
.hdr { display: flex; align-items: baseline; justify-content: space-between; max-width: 760px; }
.hdr h1 { font-size: 15px; font-weight: 700; margin: 0; }
.schema { color: var(--d-text-2); font-size: 11.5px; }
.hdr-r { display: inline-flex; align-items: baseline; gap: 16px; white-space: nowrap; }
.hlink { color: var(--d-accent); font-size: 11.5px; cursor: pointer; }
.tooltip { position: absolute; z-index: 6; max-width: 560px; padding: 3px 8px; background: var(--d-tip); color: var(--d-tip-text); border: 1px solid var(--d-tip-border); border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.14); font-size: 12px; line-height: 1.35; }
.pointer { position: absolute; z-index: 7; width: 14px; height: 20px; pointer-events: none; }
.banner { max-width: 760px; margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border: 1px solid; border-radius: 4px; }
.banner.info { background: var(--d-info-tint); border-color: #a9c7ea; }
.banner.warn { background: var(--d-warning-tint); border-color: var(--d-warning-edge); }
.banner b { font-weight: 600; }
.banner .act { margin-left: auto; color: var(--d-accent); white-space: nowrap; }
section { max-width: 760px; margin-top: 14px; }
section h2 { font-size: 13px; font-weight: 700; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
section h2::after { content: ''; flex: 1; height: 1px; background: var(--d-divider); }
.row { display: grid; grid-template-columns: 184px auto; column-gap: 14px; margin-bottom: 10px; }
.row > label { padding-top: 5px; }
.ctl { display: flex; align-items: center; gap: 6px; }
.note { color: var(--d-text-2); font-size: 11.5px; margin-top: 3px; max-width: 560px; }
.msg { display: flex; gap: 5px; align-items: flex-start; font-size: 12px; margin-top: 4px; max-width: 560px; }
.msg svg { flex: none; margin-top: 1px; }
.msg.err { color: var(--d-error); } .msg.warn { color: var(--d-warning); } .msg.note { color: var(--d-text-2); }
.field { height: 28px; border: 1px solid var(--d-border); border-radius: 4px; background: var(--d-surface); display: flex; align-items: center; padding: 0 0 0 8px; }
.field.err { border-color: var(--d-error); } .field.warn { border-color: var(--d-warning-edge); }
.field.focus { border-color: var(--d-accent); box-shadow: 0 0 0 2px #bcd5f0; }
.field.ro { background: var(--d-disabled); color: var(--d-text-2); }
.field .val { flex: 1; white-space: nowrap; overflow: hidden; }
.field .ph { color: var(--d-text-2); flex: 1; }
.field .arrow { width: 26px; height: 26px; display: grid; place-items: center; border-left: 1px solid var(--d-divider); color: var(--d-text-2); }
.mono { font-family: var(--mono); font-size: 12px; }
.btn { height: 28px; min-width: 28px; border: 1px solid var(--d-border); border-radius: 4px; background: #f7f8f9; display: grid; place-items: center; color: var(--d-text-2); padding: 0 8px; }
.btn.icon { padding: 0; width: 28px; }
.status { width: 18px; display: grid; place-items: center; }
.chips { min-height: 30px; width: 420px; border: 1px solid var(--d-border); border-radius: 4px; background: var(--d-surface); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 3px 0 3px 4px; position: relative; }
.chips.err { border-color: var(--d-error); } .chips.focus { border-color: var(--d-accent); box-shadow: 0 0 0 2px #bcd5f0; }
.chip { height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 0 4px 0 7px; background: var(--d-chip); border: 1px solid transparent; border-radius: 3px; font-size: 12px; }
.chip .rm { color: var(--d-text-2); width: 14px; text-align: center; }
.chip.warn { background: var(--d-warning-tint); border-color: var(--d-warning-edge); color: #5c3a00; }
.chip.err { background: #fbe9ea; border-color: var(--d-error); color: #7a1520; }
.chips .add { flex: 1; min-width: 110px; color: var(--d-text-2); font-size: 12px; padding-left: 4px; }
.chips .add.typed { color: var(--d-text); }
.chips .arrow { width: 26px; align-self: stretch; display: grid; place-items: center; border-left: 1px solid var(--d-divider); color: var(--d-text-2); margin: -3px 0; }
.checks { display: flex; gap: 18px; padding-top: 5px; }
.cb { display: inline-flex; gap: 6px; align-items: center; }
.box { width: 15px; height: 15px; border: 1px solid var(--d-border); border-radius: 3px; background: var(--d-surface); display: grid; place-items: center; }
.box.on { background: var(--d-accent); border-color: var(--d-accent); }
.pair { display: flex; gap: 8px; align-items: center; }
.popup { position: absolute; background: var(--d-surface); border: 1px solid var(--d-border); border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.16); z-index: 5; font-size: 12.5px; }
.popup .ph2 { padding: 6px 10px; color: var(--d-text-2); font-size: 11.5px; border-bottom: 1px solid var(--d-divider); }
.popup .it { height: 26px; padding: 0 10px; display: flex; align-items: center; gap: 8px; }
.popup .it.hi { background: var(--d-accent); color: #fff; }
.popup .it.dim { color: var(--d-text-2); }
.popup .ft { padding: 6px 10px; color: var(--d-text-2); font-size: 11.5px; border-top: 1px solid var(--d-divider); }
.footer { height: 34px; border-top: 1px solid var(--d-divider); display: flex; align-items: center; gap: 8px; padding: 0 24px; background: var(--d-panel); font-size: 12px; }
.footer.err { color: var(--d-error); }
.statusbar { display: flex; align-items: center; gap: 16px; padding: 0 10px; border-top: 1px solid var(--d-divider); font-size: 12px; color: var(--d-text-2); background: var(--d-surface); }
.statusbar .gw { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
.statusbar .gw.down { color: var(--d-error); }
.empty { max-width: 560px; margin-top: 56px; }
.empty .glyph { width: 40px; height: 40px; border-radius: 8px; background: var(--d-info-tint); display: grid; place-items: center; margin-bottom: 12px; }
.empty h2 { font-size: 14px; font-weight: 700; margin: 0 0 6px; }
.empty p { margin: 0 0 14px; }
.empty .note { margin-top: 10px; }
.btn.primary { background: var(--d-accent); border-color: var(--d-accent); color: #fff; font-weight: 600; padding: 0 14px; display: inline-grid; }
.newtag { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 2px 8px; border-radius: 3px; background: var(--d-info-tint); border: 1px solid #a9c7ea; font-size: 12px; }
.newtag i { width: 7px; height: 7px; border-radius: 50%; background: var(--d-accent); display: inline-block; }
.footer .link { margin-left: auto; color: var(--d-accent); white-space: nowrap; }
.footer .note { color: var(--d-text-2); }
.footer .jump { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.footer span { white-space: nowrap; }
.ctxmenu { position: absolute; background: var(--d-surface); border: 1px solid var(--d-border); border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.16); padding: 4px 0; font-size: 12.5px; z-index: 5; width: 168px; }
.ctxmenu div { height: 24px; padding: 0 12px; display: flex; align-items: center; }
.ctxmenu .hi { background: var(--d-accent); color: #fff; }
.ctxmenu .dim { color: var(--d-text-2); }
.raw { max-width: 760px; margin-top: 14px; }
.raw .lbl { font-weight: 700; margin-bottom: 6px; display: flex; gap: 10px; align-items: center; }
.raw .lbl::after { content: ''; flex: 1; height: 1px; background: var(--d-divider); }
.raw pre { margin: 0; padding: 10px 12px; background: var(--d-disabled); border: 1px solid var(--d-border); border-radius: 4px; font: 12px/1.5 var(--mono); color: #3a3f45; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const I = {
  chev: '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  right: '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M3.5 2l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  refresh: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 1.5v3.4H8.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  pointer: '<svg class="pointer" viewBox="0 0 14 20"><path d="M1 1v15l4-3.6 2.6 6 2.4-1-2.6-5.9H13z" fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></svg>',
  tick: '<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 6.2l2.6 2.6L10 3.4" fill="none" stroke="#fff" stroke-width="2"/></svg>',
  err: '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--d-error)"/><path d="M5.3 5.3l5.4 5.4M10.7 5.3l-5.4 5.4" stroke="#fff" stroke-width="1.6"/></svg>',
  warn: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 1.5l7 12.5H1z" fill="var(--d-warning-edge)"/><path d="M8 6v4" stroke="#fff" stroke-width="1.6"/><circle cx="8" cy="12" r=".9" fill="#fff"/></svg>',
  info: '<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--d-accent)"/><path d="M8 7v4.5" stroke="#fff" stroke-width="1.6"/><circle cx="8" cy="4.8" r=".95" fill="#fff"/></svg>',
  lock: '<svg width="14" height="14" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7.5" rx="1.5" fill="var(--d-warning-edge)"/><path d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2" fill="none" stroke="var(--d-warning-edge)" stroke-width="1.6"/></svg>',
  cloud: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M4.5 12.5h7a3 3 0 0 0 .4-6 4 4 0 0 0-7.6 1A2.5 2.5 0 0 0 4.5 12.5z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 2l12 12" stroke="currentColor" stroke-width="1.4"/></svg>',
  folder: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M1.5 4h5l1.5 1.5h6.5v8h-13z" fill="#e8c56a" stroke="#c9a240"/></svg>',
  doc: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9z" fill="#fff" stroke="#8a9099"/></svg>',
  map: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M1.5 3.5l4-1.5 5 2 4-1.5v10l-4 1.5-5-2-4 1.5z" fill="#d7e6f6" stroke="#2675bf"/><path d="M5.5 2v10M10.5 4v10" stroke="#2675bf"/></svg>',
  x: '<svg width="9" height="9" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.4"/></svg>',
  gw: '<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg>',
};

const base = {
  inherited: false, readonly: false, gwDown: false, picker: false,
  connection: { v: 'MapStudio', state: 'ok' },
  full: [{ n: 'MapEditor' }, { n: 'Administrator' }],
  phone: [{ n: 'MapOperator' }],
  kinds: { v: 'mapstudio_adapter.kinds', state: 'ok' },
  assets: { v: 'mapstudio_adapter.assets', state: 'ok' },
  refresh: '10',
  basemaps: { none: true, osm: true, satellite: false, mapbox: false },
  alarm: { v: '/alarms/{item.name}', state: 'ok' },
  secretProvider: '', secretName: '',
  msgs: {},
};
const states = {
  normal: {},
  picker: { picker: true },
  inherited: { inherited: true },
  reasons: {
    connection: { v: 'MapStore', state: 'warn' },
    full: [{ n: 'MapEditor' }, { n: 'MapEdtor', warn: true }],
    phone: [{ n: 'MapOperator' }, { n: 'MapOperator', err: true }],
    refresh: '0',
    msgs: {
      connection: [['warn', 'MapStore is not a database connection of this Gateway yet. Map Studio waits for it; add it on the Gateway under Connections &gt; Databases.']],
      full: [['warn', 'MapEdtor is not a role of the identity provider default. It is saved as typed; nobody holds it until the provider has it.']],
      phone: [['err', 'MapOperator is listed twice.']],
      refresh: [['err', 'refreshIntervalSeconds must be a whole number from 1 to 3600, not 0.']],
    },
  },
  unreachable: { gwDown: true, connection: { v: 'MapStudio', state: 'down' } },
  newer: { readonly: true },
  empty: { none: true },
  new: {
    isNew: true,
    connection: { v: '', state: '' },
    full: [{ n: 'MapEditor' }],
    phone: [{ n: 'MapOperator' }],
    kinds: { v: '', state: '' },
    assets: { v: '', state: '' },
    alarm: { v: '', state: '' },
    msgs: { connection: [['err', 'Name the database connection Map Studio stores the map in.']] },
  },
};
const v = new URLSearchParams(location.search).get('v') || 'normal';
const S = Object.assign({}, base, states[v] || {});
if (S.gwDown) { S.secretProvider = ''; }

// A mark only when something is wrong (owner, 2026-10-27): found values and unavailable lists show nothing.
function status(state) {
  return state === 'warn' ? `<span class="status">${I.warn}</span>` : '';
}
function msgs(key) {
  return (S.msgs[key] || []).map(([k, t]) => `<div class="msg ${k}">${k === 'err' ? I.err : I.warn}<span>${t}</span></div>`).join('');
}
function combo(val, width, opts = {}) {
  const cls = ['field', opts.cls || ''].join(' ');
  const inner = val ? `<span class="val ${opts.mono ? 'mono' : ''}">${val}</span>` : `<span class="ph">${opts.ph || 'Select one...'}</span>`;
  return `<div class="${cls}" style="width:${width}px">${inner}<span class="arrow">${I.chev}</span></div>`;
}
function chips(list, key, opts = {}) {
  const hasErr = list.some(c => c.err);
  const cs = list.map(c => `<span class="chip ${c.warn ? 'warn' : ''} ${c.err ? 'err' : ''}">${c.warn ? I.warn : ''}${c.err ? I.err : ''}${c.n}<span class="rm">${I.x}</span></span>`).join('');
  const add = opts.typed ? `<span class="add typed">${opts.typed}<span style="border-left:1px solid var(--d-text);margin-left:1px"></span></span>` : `<span class="add">Add a role...</span>`;
  return `<div class="chips ${hasErr ? 'err' : ''} ${opts.focus ? 'focus' : ''}" id="chips-${key}">${cs}${add}<span class="arrow">${I.chev}</span></div>`;
}
// tip: the label's tooltip (the old help text); note: the one line kept visible (Map token only).
function row(label, ctl, tip, key, note) {
  return `<div class="row"><label id="lbl-${key}" title="${tip.replace(/"/g, '&quot;')}">${label}</label><div><div class="ctl">${ctl}</div>${msgs(key)}${note ? `<div class="note">${note}</div>` : ''}</div></div>`;
}

const reasonsLeft = Object.values(S.msgs).flat().filter(m => m[0] === 'err').length;
const warningsLeft = Object.values(S.msgs).flat().filter(m => m[0] === 'warn').length;

let form;
if (S.none) {
  form = `<div class="empty"><div class="glyph">${I.map}</div><h2>No Map Studio setup</h2><p>This project has no Map Studio setup yet. The map store is unavailable until it has one.</p><span class="btn primary">Create setup</span><div class="note">Create setup fills this tab with the defaults. Nothing is written until File &gt; Save.</div></div>`;
} else if (S.readonly) {
  form = `
  <div class="banner warn">${I.lock}<div><b>Read only.</b> This setup was written by a newer Map Studio (schema 2). This Designer edits schema 1. It is shown as written and never rewritten here.</div></div>
  <div class="raw"><div class="lbl">setup.json as written</div><pre>{
  "schemaVersion": 2,
  "connection": "MapStudio",
  "roles": {
    "full": ["MapEditor", "Administrator"],
    "phone": ["MapOperator"]
  },
  "kindsFunction": "mapstudio_adapter.kinds",
  "assetsFunction": "mapstudio_adapter.assets",
  "refreshIntervalSeconds": 10,
  "alarmPage": "/alarms/{item.name}",
  "basemaps": ["none", "osm"],
  "tokenSecret": "",
  "labelZoom": 14
}</pre><div class="note" style="margin-top:6px">To edit it, open the project in a Designer with the newer Map Studio module, or edit setup.json and scan the project.</div></div>`;
} else {
  const inh = S.inherited ? `<div class="banner info">${I.info}<div><b>Inherited from template-base.</b> Saving makes this project's own copy.</div></div>` : '';
  const conn = S.connection;
  const connCls = conn.state === 'warn' ? 'warn' : '';
  const secretRow = `<div class="pair">${combo(S.secretProvider, 170, { ph: S.gwDown ? 'Type a provider' : 'Select one...' })}${combo(S.secretName, 202, { ph: 'Secret name', mono: true })}</div>`;
  form = `${inh}
  <section id="s-store"><h2>Map store</h2>
    ${row('Database connection', combo(conn.v, 340, { cls: S.isNew ? 'err focus' : connCls, ph: S.isNew ? 'Select one or type a name...' : 'Select one...' }) + status(conn.state),
      'The Gateway database connection (PostgreSQL) the map is stored in. Pick one or type a name.', 'connection')}
  </section>
  <section id="s-who"><h2>Who can edit</h2>

    ${row('Phone-editing roles', chips(S.phone, 'phone'),
      'Move points and edit properties from a phone. A role in both lists gets full editing.', 'phone')}
  </section>
  <section id="s-kinds"><h2>Kinds and assets</h2>
    ${row('Kinds function', combo(S.kinds.v, 340, { mono: true, ph: 'Select one...' }) + status(S.kinds.state),
      'The project library function that returns the kind list, as package.function.', 'kinds')}

    ${row('Refresh interval', `<div class="field ${S.refresh === '0' ? 'err' : ''}" style="width:96px;padding-right:0"><span class="val">${S.refresh}</span><span class="arrow" style="display:flex;flex-direction:column;justify-content:center;gap:0"><span style="transform:rotate(180deg);line-height:8px">${I.chev}</span><span style="line-height:8px">${I.chev}</span></span></div><span style="color:var(--d-text-2)">seconds</span>`,

}

// The footer shows only when it has something to say (owner, 2026-10-27): reasons left,
// a new unsaved setup, or the Gateway not reachable. Plain normal, inherited, empty and
// newer states have none.
const reasonsLine = reasonsLeft
  ? `${I.err}<span><span class="jump" title="Go to the first reason">${reasonsLeft} ${reasonsLeft === 1 ? 'reason' : 'reasons'} left</span> - this setup is not saved until ${reasonsLeft === 1 ? 'it is' : 'they are'} fixed.</span>`
  : '';
const footer = S.none || S.readonly
  ? ''
  : S.isNew
  ? `<div class="footer err">${reasonsLine || `<span class="note">New setup - not saved yet.</span>`}${reasonsLeft ? `<span class="note" style="margin-left:6px">File &gt; Save shows the Designer's standard save failure.</span>` : ''}<span class="link">Discard new setup</span></div>`
  : reasonsLeft
  ? `<div class="footer err">${reasonsLine}${warningsLeft ? `<span style="color:var(--d-text-2);margin-left:6px">${warningsLeft} warnings do not stop a save.</span>` : ''}</div>`
  : S.gwDown
  ? `<div class="footer">${I.cloud}<span><b style="font-weight:600">Gateway not reachable - lists unavailable, typing still works.</b></span><span class="note" style="margin-left:6px">Connections, roles and secret providers come back with the Gateway; functions and pages are still listed.</span><span class="link">Try again</span></div>`
  : '';

          <div class="hdr"><div><h1>Map Studio Setup</h1>${S.isNew ? '<div class="newtag"><i></i>New setup - saves with the project</div>' : ''}</div><span class="hdr-r">${S.none || S.readonly ? '' : '<span class="hlink" title="Read the Gateway\'s connections, roles and secret providers and the project\'s functions and pages again">Refresh lists</span>'}<span class="schema">${S.none ? '' : S.readonly ? 'Schema 2 - read only' : 'Schema version 1'}</span></span></div>

const sc = document.getElementById('scroll');
function fitScrollbar() { document.getElementById('sb').style.display = sc.scrollHeight > sc.clientHeight + 4 ? 'block' : 'none'; }
fitScrollbar();
if (document.fonts) document.fonts.ready.then(fitScrollbar);

if (v === 'normal') {
  const lb = document.getElementById('lbl-phone');
  const r = lb.getBoundingClientRect();
  const tip = document.createElement('div');
  tip.className = 'tooltip';
  tip.textContent = lb.getAttribute('title');
  // Swing puts the tooltip just under the pointer; one line, so it sits between the row and the next heading.
  const below = document.getElementById('chips-phone').getBoundingClientRect().bottom + 2;
  // Pointer at the label's end, so the tooltip clears the next heading's words (only its rule runs under it).
  const rg = document.createRange(); rg.selectNodeContents(lb);
  const px = rg.getBoundingClientRect().right - 8, py = below - 19;
  tip.style.left = (px + 4) + 'px'; tip.style.top = below + 'px'; tip.style.whiteSpace = 'nowrap';
  document.body.appendChild(tip);
  const ptr = document.createElement('div');
  ptr.innerHTML = I.pointer;
  const svg = ptr.firstChild; svg.style.left = px + 'px'; svg.style.top = py + 'px';
  document.body.appendChild(svg);
}

if (S.picker) {
  const ch = document.getElementById('chips-full').getBoundingClientRect();
  const p = document.createElement('div');
  p.className = 'popup';
