<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Studio Layouts</title>
<style>
/*
  Map Studio - editor layout directions (UX workshop, 2026-10-26)
  Three LAYOUT directions on one fixed visual identity. Palette is not varied.

  Theme tokens (Perspective light theme stand-ins; the module ships no colour, AD-11):
    --neutral-10  #ffffff  panels, cards
    --neutral-20  #eef0f2  basemap (flat light grey, no tiles)
    --neutral-30  #e2e5e8  lease roads, dividers, hover
    --neutral-40  #ccd1d6  borders
    --neutral-50  #a9afb6  geofence outline, laterals
    --neutral-60  #858c94  pipelines, dots below zoom 14
    --neutral-70  #5f666e  secondary text, normal glyphs
    --neutral-80  #3c4249  kind glyphs, strong text
    --neutral-90  #1e2227  attention outline
    --label          #1e2227  text
    --container      #ffffff  component background
    --callToAction   #2f6fdc  selection ring, primary buttons, snap indicator
    --warning        #a86200  save conflict (always with glyph and words)
    --error          #c62828  alarm priority 1 (always with triangle glyph and digit)
  Tints are derived with color-mix from these tokens only.
  Rules applied: normal items neutral grey; hue only for problems and always with a glyph or word;
  comms lost and stale are words and shapes, never colour; styles come from presets, no colour pickers;
  below zoom 14 sites are neutral dots, from 14 the kind icon; zoom top-right; bottom-right corner
  kept clear for the Perspective App Bar toggle.
  Icons: kind and state glyphs inlined from web/icons/src (approved set). UI chrome glyphs
  (eye, list, layers, upload, undo...) are stand-ins drawn on the same 24 px / 2 px grid.
*/
:root{
  --neutral-10:#ffffff; --neutral-20:#eef0f2; --neutral-30:#e2e5e8; --neutral-40:#ccd1d6; --neutral-50:#a9afb6;
  --neutral-60:#858c94; --neutral-70:#5f666e; --neutral-80:#3c4249; --neutral-90:#1e2227;
  --label:#1e2227; --container:#ffffff; --callToAction:#2f6fdc; --warning:#a86200; --error:#c62828;
  --cta-tint:color-mix(in srgb, var(--callToAction) 12%, transparent);
  --warn-tint:color-mix(in srgb, var(--warning) 10%, var(--container));
  --err-tint:color-mix(in srgb, var(--error) 8%, var(--container));
  --shadow:0 1px 2px rgba(30,34,39,.10), 0 4px 14px rgba(30,34,39,.10);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--neutral-30);color:var(--label);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- workshop switcher (outside the product) ---------- */
.sw{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:var(--neutral-90);color:var(--neutral-10)}
.sw b{font-weight:600;margin-right:8px}
.seg{display:inline-flex;border:1px solid var(--neutral-70);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;color:var(--neutral-40)}
.seg button.on{background:var(--neutral-10);color:var(--neutral-90);font-weight:600}
.sw .lbl{color:var(--neutral-50);font-size:12px}
.wrap{padding:20px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rat{max-width:1440px;width:100%;background:var(--neutral-10);border-radius:8px;padding:14px 18px;display:grid;grid-template-columns:200px 1fr;gap:16px}
.rat h2{margin:0;font-size:16px}
.rat p{margin:0;color:var(--neutral-80)}
.rat .hint{grid-column:1/-1;color:var(--neutral-70);font-size:12px;border-top:1px solid var(--neutral-30);padding-top:8px}
/* ---------- device frame: a Perspective page ---------- */
.frame{position:relative;background:var(--container);border-radius:6px;overflow:hidden;box-shadow:0 2px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;flex:none}
.host{height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--neutral-30);background:var(--container)}
.host .crumb{color:var(--neutral-70)} .host .crumb b{color:var(--label);font-weight:600}
.host .who{margin-left:auto;color:var(--neutral-70);font-size:12px}
.appbar{position:absolute;right:0;bottom:0;width:58px;height:22px;background:var(--neutral-80);color:var(--neutral-10);border-top-left-radius:6px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px;z-index:40}
.comp{position:relative;flex:1;display:flex;min-height:0;background:var(--container)}
/* ---------- shared bits ---------- */
.ic{display:inline-block;vertical-align:middle;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--neutral-40);background:var(--neutral-10)}
.btn:hover{background:var(--neutral-20)}
.btn.pri{background:var(--callToAction);border-color:var(--callToAction);color:var(--neutral-10)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.ibtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:0;background:transparent;color:var(--neutral-80)}
.ibtn:hover{background:var(--neutral-20)}
.ibtn.on{background:var(--cta-tint);color:var(--callToAction)}
.muted{color:var(--neutral-70)} .small{font-size:12px} .tiny{font-size:11px}
.input{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--neutral-40);border-radius:6px;background:var(--neutral-10);color:var(--neutral-70)}
.input.val{color:var(--label)}
.field{margin-bottom:12px}
.field>label{display:flex;justify-content:space-between;font-size:12px;color:var(--neutral-70);margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:10px;background:var(--neutral-20);color:var(--neutral-80);font-size:11px;white-space:nowrap}
.tag.ovr{background:var(--cta-tint);color:var(--callToAction)}
.tag.err{background:var(--err-tint);color:var(--error)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--neutral-40);background:var(--neutral-10);font-size:12px;color:var(--neutral-80)}
.chip.on{border-color:var(--neutral-90);background:var(--neutral-90);color:var(--neutral-10)}
.chip .n{color:inherit;opacity:.7}
.sect{padding:14px 16px;border-bottom:1px solid var(--neutral-30)}
.sect h4{margin:0 0 10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--neutral-70);display:flex;justify-content:space-between;align-items:center}
.sect h4 .tag{text-transform:none;letter-spacing:0}
.kv{display:flex;justify-content:space-between;align-items:center;padding:5px 0;gap:8px}
.kv .k{color:var(--neutral-70)}
.sw2{width:30px;height:18px;border-radius:9px;background:var(--neutral-40);position:relative;flex:none;border:0;padding:0}
.sw2::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--neutral-10);transition:left .15s}
.sw2.on{background:var(--neutral-90)} .sw2.on::after{left:14px}
.check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--neutral-60);display:inline-flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--neutral-90);border-color:var(--neutral-90);color:var(--neutral-10)}
.presets{display:inline-flex;border:1px solid var(--neutral-40);border-radius:6px;overflow:hidden}
.presets span{padding:4px 9px;font-size:12px;color:var(--neutral-70);border-right:1px solid var(--neutral-40)}
.presets span:last-child{border-right:0}
.presets span.on{background:var(--neutral-90);color:var(--neutral-10)}
.note{background:var(--neutral-20);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--neutral-80)}
/* ---------- panels ---------- */
.panel{background:var(--neutral-10);display:flex;flex-direction:column;min-height:0;flex:none;border-right:1px solid var(--neutral-30)}
.panel.right{border-right:0;border-left:1px solid var(--neutral-30)}
.ph{padding:12px 16px 10px;border-bottom:1px solid var(--neutral-30)}
.ph .row{display:flex;align-items:center;gap:8px}
.ph h3{margin:0;font-size:16px;font-weight:600}
.pbody{flex:1;overflow:auto;min-height:0}
.pfoot{padding:10px 16px;border-top:1px solid var(--neutral-30);display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:18px;margin-top:10px}
.tabs button{border:0;background:none;padding:6px 0;color:var(--neutral-70);border-bottom:2px solid transparent}
.tabs button.on{color:var(--label);font-weight:600;border-bottom-color:var(--neutral-90)}
.grp{padding:8px 8px 4px}
.grp .gh{display:flex;justify-content:space-between;padding:4px 8px;font-size:11px;font-weight:600;color:var(--neutral-70);text-transform:uppercase;letter-spacing:.04em}
.row-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px;color:var(--label)}
.row-i:hover{background:var(--neutral-20)}
.row-i.sel{background:var(--cta-tint);box-shadow:inset 3px 0 0 var(--callToAction)}
.row-i .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-i .ki{color:var(--neutral-70)}
.st{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--neutral-70);white-space:nowrap}
.st.a1{color:var(--error);font-weight:600}
/* ---------- rail ---------- */
.rail{width:72px;flex:none;background:var(--neutral-10);border-right:1px solid var(--neutral-30);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.rail button{width:60px;border:0;background:none;border-radius:10px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--neutral-70)}
.rail button:hover{background:var(--neutral-20)}
.rail button.on{background:var(--neutral-20);color:var(--label);font-weight:600}
.rail.slim{width:56px} .rail.slim button{width:44px;font-size:10px}
/* ---------- map ---------- */
.map{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--neutral-20)}
.world{position:absolute;left:50%;top:50%;width:1400px;height:900px;transition:transform .25s}
.world svg.base{position:absolute;inset:0}
.mk{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk .disc{width:34px;height:34px;border-radius:50%;background:var(--neutral-10);border:1.5px solid var(--neutral-50);color:var(--neutral-80);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--neutral-20),0 1px 3px rgba(30,34,39,.18);position:relative}
.mk.lost .disc{border-style:dashed;border-color:var(--neutral-70);color:var(--neutral-60)}
.mk.sel .disc{box-shadow:0 0 0 2px var(--neutral-10),0 0 0 4px var(--callToAction)}
.mk .badge{position:absolute;top:-9px;right:-14px;display:flex;align-items:center;gap:1px;font-weight:700;font-size:11px}
.mk .badge.a1{color:var(--error)}
.mk .badge.g{color:var(--neutral-80);background:var(--neutral-10);border-radius:50%;padding:1px}
.mk .lab{margin-top:3px;font-size:12px;font-weight:600;color:var(--neutral-90);text-shadow:0 0 3px var(--neutral-20),0 0 3px var(--neutral-20),0 0 2px var(--neutral-20);white-space:nowrap;display:flex;gap:4px;align-items:center}
.mk .lab .w{font-weight:500;font-size:11px;color:var(--neutral-80);background:var(--neutral-10);border:1px solid var(--neutral-50);border-radius:3px;padding:0 4px;text-shadow:none}
.mk .dot{width:11px;height:11px;border-radius:50%;background:var(--neutral-60);box-shadow:0 0 0 2px var(--neutral-20)}
.mk.lost .dot{background:var(--neutral-20);border:2px dashed var(--neutral-70)}
.mk.sel .dot{box-shadow:0 0 0 2px var(--neutral-10),0 0 0 4px var(--callToAction)}
.float{position:absolute;background:var(--neutral-10);border-radius:10px;box-shadow:var(--shadow);z-index:5}
.toolbar{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px}
.toolbar .div{width:1px;height:22px;background:var(--neutral-30);margin:0 4px}
.modepill{display:inline-flex;align-items:center;gap:6px;padding:0 10px 0 6px;height:32px;font-size:12px;font-weight:600;color:var(--neutral-80);white-space:nowrap}
.strip{top:12px;left:12px;display:flex;flex-direction:column;gap:2px;padding:4px}
.strip .div{height:1px;width:22px;background:var(--neutral-30);margin:4px auto}
.tr{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:6}
.editsw{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;font-weight:600;font-size:12px;border:0}
.zoom{display:flex;flex-direction:column;align-items:center;padding:2px;border-radius:8px}
.zoom .zl{font-size:10px;color:var(--neutral-70);padding:2px 0}
.search{top:12px;left:12px;width:300px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;color:var(--neutral-70)}
.legend{left:12px;bottom:12px;padding:10px 12px;width:208px;font-size:12px}
.legend h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--neutral-70);display:flex;justify-content:space-between}
.legend .li{display:flex;align-items:center;gap:8px;padding:2px 0;color:var(--neutral-80)}
.legend .tog{display:flex;gap:12px;border-top:1px solid var(--neutral-30);margin-top:6px;padding-top:6px}
.popup{position:absolute;width:290px;transform:translate(-50%,calc(-100% - 30px));background:var(--neutral-10);border-radius:10px;box-shadow:var(--shadow);z-index:8;font-size:12px}
.popup::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--neutral-10);transform:translateX(-50%) rotate(45deg);box-shadow:3px 3px 4px rgba(30,34,39,.06)}
.popup .phd{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 8px}
.popup .phd h3{margin:0;font-size:16px}
.popup .pb{padding:0 12px 8px}
.popup .alm{margin:4px 12px 10px;padding:8px 10px;border-radius:6px;background:var(--err-tint);border-left:3px solid var(--error)}
.popup .acts{display:flex;gap:8px;padding:0 12px 12px}
.drawbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;white-space:nowrap;z-index:7}
.snaphint{position:absolute;transform:translate(14px,-46px);background:var(--neutral-90);color:var(--neutral-10);font-size:11px;padding:4px 8px;border-radius:5px;white-space:nowrap;z-index:6}
.save{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--neutral-70);border:0;background:none;padding:4px 6px;border-radius:6px;white-space:nowrap}
.save:hover{background:var(--neutral-20)}
.save.conf{color:var(--warning);background:var(--warn-tint);font-weight:600}
.spin{width:12px;height:12px;border:2px solid var(--neutral-40);border-top-color:var(--neutral-80);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.conflict{position:absolute;z-index:20;width:330px;padding:14px;border-left:3px solid var(--warning)}
.conflict h4{margin:0 0 6px;font-size:13px;display:flex;gap:6px;align-items:center;color:var(--warning)}
.conflict p{margin:0 0 8px;color:var(--neutral-80);font-size:12px}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--neutral-90);color:var(--neutral-10);border-radius:8px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;z-index:9}
.toast .btn{background:transparent;color:var(--neutral-10);border-color:var(--neutral-70)}
/* B slide panel */
.slide{position:absolute;top:0;bottom:0;width:360px;background:var(--neutral-10);box-shadow:4px 0 18px rgba(30,34,39,.12);z-index:12;display:flex;flex-direction:column;transition:transform .25s}
.slide.closed{transform:translateX(-110%)}
/* kind preview */
.pv{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.pv .disc{width:34px;height:34px;border-radius:50%;background:var(--neutral-10);border:1.5px solid var(--neutral-50);color:var(--neutral-80);display:flex;align-items:center;justify-content:center}
.pv.dim .disc{opacity:.5;border-style:dashed;border-color:var(--neutral-60)}
.pv.att .disc{border:3px solid var(--neutral-90);color:var(--neutral-90)}
.rule{display:grid;grid-template-columns:1fr 18px 1fr 64px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--neutral-30)}
.rule:last-child{border-bottom:0}
.sel-like{display:flex;align-items:center;justify-content:space-between;gap:6px;height:30px;padding:0 8px;border:1px solid var(--neutral-40);border-radius:6px;background:var(--neutral-10);font-size:12px}
.empty{padding:28px 20px;text-align:center;color:var(--neutral-70)}
.drop{border:1.5px dashed var(--neutral-50);border-radius:8px;padding:22px;text-align:center;color:var(--neutral-70)}
.scale{position:absolute;left:236px;bottom:14px;font-size:10px;color:var(--neutral-70);display:flex;flex-direction:column;gap:2px;z-index:4}
.scale i{display:block;width:80px;height:5px;border:1.5px solid var(--neutral-70);border-top:0}
</style>
</head>
<body>
<div class="sw" id="sw"></div>
<div class="wrap">
  <div class="rat" id="rat"></div>
  <div class="frame" id="frame"></div>
</div>

  return '<div class="float conflict" style="'+pos+'"><h4>'+ic('warn',16)+'Not saved - conflict with Sam\'s change</h4><p><b>Sam</b> moved P14 about 40 m north at 10:42, while you were editing it.</p><p>Your change, kept here and not saved: label position Right, Gas rate switched on.</p><div style="display:flex;gap:8px"><button class="btn sm" data-act="resolve">Use Sam\'s version</button><button class="btn sm pri" data-act="resolve">Apply mine on top</button></div></div>';
}
function viewMap(){
  return '<div class="map">'+mapWorld(0)+'<div class="float search">'+ic('search',18)+'Search sites, wells or lines</div>'+legend()+topRight(false)+'<div class="scale"><span>500 m</span><i></i></div></div>';
}

/* ---------- list, details, kinds, layers, import ---------- */
/* place tree: field, then site, then what is on it; attention first */
var PLACES=[
  {site:'P14',on:['P14 lateral'],wells:['P14-2H'],att:3},
  {site:'P21',on:[],wells:['P21-1H'],att:2},
  {site:'SWD1',on:[],att:1},
  {site:'P12',on:['P12 lateral'],wells:['P12-3H'],att:1},
  {site:'CTB1',on:['L-SWD'],att:0},
  {site:'CS01',on:['L-GL21'],att:0}
];
var CHG={'P14':'Today 10:42 - Sam','P12 lateral':'Today 10:31 - you','P21':'Today 08:05 - you','SWD1':'Oct 24','L-SWD':'Oct 24','L-GL21':'Oct 23','P14 lateral':'Oct 23','Mesa lease':'Oct 20','P12':'Yesterday 16:20','CTB1':'Today 09:12','CS01':'Oct 22'};
var SORTS=[['attention','Needs attention'],['place','Place'],['kind','Kind'],['name','Name'],['changed','Last changed']];
function needs(it){return !!(it.alarm||it.lost||it.stale||it.unlinked);}
function rowI(it,indent,extra){
  var k=KINDS[it.kind];
  return '<button class="row-i'+(S.sel===it.id?' sel':'')+'" style="padding-left:'+(8+indent)+'px" data-act="sel" data-id="'+it.id+'"><span class="ki">'+ic(k.icon,17)+'</span><span class="nm">'+it.id+(extra?' <span class="tiny muted">'+extra+'</span>':'')+'</span>'+stBadge(it)+'</button>';
}
function pass(it){return S.filter==='all'||S.filter===it.kind;}
function listBody(){
  var lab=SORTS.filter(function(x){return x[0]===S.sort;})[0][1];
  var h='<div style="padding:12px 16px 8px;display:flex;gap:8px"><div class="input" style="flex:1;min-width:0">'+ic('search',16)+'Search items</div></div>';
  h+='<div style="padding:0 16px 8px;display:flex;align-items:center;gap:6px;position:relative"><span class="small muted">Sort by</span><button class="sel-like" style="flex:1" data-act="sortopen">'+ic('sort',14)+'<span style="flex:1;text-align:left">'+lab+'</span>'+ic('chev',14)+'</button>';
  if(S.sortOpen){h+='<div class="float" style="top:34px;left:62px;right:16px;padding:4px">'+SORTS.map(function(x){return '<button class="row-i'+(S.sort===x[0]?' sel':'')+'" data-act="sort" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>';}
  h+='</div>';
  h+='<div class="chips" style="padding:0 16px 10px"><button class="chip'+(S.filter==='all'?' on':'')+'" data-act="filter" data-v="all">All <span class="n">11</span></button>';
  KORDER.forEach(function(k){h+='<button class="chip'+(S.filter===k?' on':'')+'" data-act="filter" data-v="'+k+'">'+KINDS[k].label+' <span class="n">'+KINDS[k].n+'</span></button>';});
  h+='</div><div style="border-top:1px solid var(--neutral-30)"></div>';
  var extra=ITEMS.filter(function(i){return i.isNew&&pass(i);});
  if(extra.length){h+='<div class="grp"><div class="gh"><span>Just added</span></div>';extra.forEach(function(it){h+=rowI(it,0);});h+='</div>';}
  if(S.sort==='attention'||S.sort==='place'){
    var pl=PLACES.slice(); if(S.sort==='place')pl.sort(function(a,b){return a.site<b.site?-1:1;});
    var natt=ITEMS.filter(needs).length;
    h+='<div class="grp"><div class="gh"><span>Mesa field</span><span>'+(S.sort==='attention'?natt+' need attention':'11 items')+'</span></div>';
    pl.forEach(function(p){
      var site=item(p.site), ons=p.on.map(item);
      if(S.sort==='attention')ons.sort(function(a,b){return needs(b)-needs(a);});
      var rows=[site].concat(ons).filter(pass); if(!rows.length)return;
      if(S.sort==='attention'&&p.att===0&&!h.match(/data-sep/)){h+='<div data-sep class="tiny muted" style="padding:8px 10px 2px;border-top:1px solid var(--neutral-30);margin-top:4px">All normal</div>';}
      if(pass(site))h+=rowI(site,0);
      (p.wells||[]).forEach(function(w){if(S.filter==='all')h+='<div class="row-i" style="padding-left:34px;color:var(--neutral-70);cursor:default"><span class="ki">'+ic('wellhead',15)+'</span><span class="nm small">'+w+' <span class="tiny">well, on '+p.site+'</span></span></div>';});
      ons.filter(pass).forEach(function(it){h+=rowI(it,26);});
    });
    var g=item('Mesa lease'); if(pass(g))h+='<div class="tiny muted" style="padding:8px 10px 2px;border-top:1px solid var(--neutral-30);margin-top:4px">Field-wide</div>'+rowI(g,0);
    h+='</div>';
  }else if(S.sort==='kind'){
    KORDER.forEach(function(k){
      var rows=ITEMS.filter(function(i){return i.kind===k&&!i.isNew&&pass(i);}); if(!rows.length)return;
      h+='<div class="grp"><div class="gh"><span>'+KINDS[k].label+'</span><span>'+rows.length+'</span></div>';
      rows.forEach(function(it){h+=rowI(it,0);});h+='</div>';
    });
  }else{
    var rows=ITEMS.filter(function(i){return !i.isNew&&pass(i);});
    if(S.sort==='name')rows.sort(function(a,b){return a.id<b.id?-1:1;});
    else {var ord=['P14','P12 lateral','CTB1','P21','P12','SWD1','L-SWD','CS01','L-GL21','P14 lateral','Mesa lease'];rows.sort(function(a,b){return ord.indexOf(a.id)-ord.indexOf(b.id);});}
    h+='<div class="grp">';rows.forEach(function(it){h+=rowI(it,0,S.sort==='changed'?CHG[it.id]:'');});h+='</div>';
  }
  return h;
}
function listFoot(){return '<div class="pfoot"><button class="btn" style="flex:1;justify-content:center" data-act="tool" data-v="point">'+ic('plus',16)+'Add item</button><span class="small muted">1 unlinked</span></div>';}

  var k=KINDS[it.kind];
  return '<div class="ph">'+(back?'<button class="btn ghost sm" style="margin:-4px 0 6px -8px" data-act="back">'+ic('back',16)+'All items</button>':'')+
   '<div class="row"><span style="color:var(--neutral-80)">'+ic(k.icon,22)+'</span><div style="flex:1;min-width:0"><h3>'+it.id+'</h3><div class="small muted">'+k.label+(it.asset?' - linked to '+it.asset:' - not linked')+'</div></div>'+(close?'<button class="ibtn" data-act="close" title="Close">'+ic('x',18)+'</button>':'')+'</div>'+
   '<div class="tabs">'+['details','style','link'].map(function(t){return '<button class="'+(S.tab===t?'on':'')+'" data-act="tab" data-v="'+t+'">'+t.charAt(0).toUpperCase()+t.slice(1)+'</button>';}).join('')+'</div></div>';

function detailsBody(it){
  var k=KINDS[it.kind], h='';
  if(S.tab==='details'){
    h+='<div class="sect"><div class="field"><label>Name <span>Required</span></label><div class="input val">'+it.id+'</div></div>';
    h+='<div class="field"><label>Kind <span>Required</span></label><div class="sel-like"'+(it.kind==='none'?' style="border-color:var(--neutral-90);border-width:2px"':'')+'>'+ic(k.icon,15)+(it.kind==='none'?'Pick a kind: Well pad, Tank battery, Compressor station, SWD':k.label)+'<span style="margin-left:auto">'+ic('chev',14)+'</span></div></div>';
    if(it.x){
      h+='<div class="field"><label>Location <span>Latitude, longitude</span></label><div class="input val">'+ic('pin',15)+it.ll+'</div><div class="tiny muted" style="margin-top:4px">Click the map, then drag the pin to fine-tune. Type here as a backup.</div><div class="tiny muted" style="margin-top:4px;display:flex;justify-content:space-between"><span>Lea County, New Mexico, US</span><button class="btn ghost sm" style="height:18px;padding:0">Zoom to location</button></div></div>';
      if(it.isNew)h+='<div class="field"><label>Asset</label><div class="note">Not linked yet - pick the asset on the Link tab.</div></div>';
      if(it.wells)h+='<div class="field"><label>Wells on pad</label><div class="chips"><span class="tag">'+ic('wellhead',12)+it.wells+'</span></div></div>';
      if(!it.isNew)h+='<div class="field" style="margin:0"><label>Access road note</label><div class="input val small">'+(it.id==='P14'?'Gate code at CR 748 turn-off':'Lease Rd 3')+'</div></div>';
      h+='</div>';
      if(!it.isNew)h+='<div class="sect"><h4>Live now <span class="tag">From kind</span></h4><div class="kv"><span class="k">Comms</span><span style="display:flex;gap:4px;align-items:center">'+(it.lost?ic('comms-lost',14):'')+it.comms+'</span></div><div class="kv"><span class="k">'+it.kvn+' '+ic('star',12)+'</span><b style="display:flex;gap:4px;align-items:center">'+(it.stale?ic('stale',14)+'Stale - ':'')+it.kv+'</b></div>'+
        (it.alarm?'<div class="kv"><span class="k">Alarms</span><span class="st a1">'+fi('a1u',14)+'1 - '+it.alarm.text+'</span></div>':'<div class="kv"><span class="k">Alarms</span><span class="muted">None</span></div>')+'</div>';
    }else if(it.kind==='geo'){
      h+='<div class="field" style="margin:0"><label>Area</label><div class="input val">'+it.area+' - 5 points</div></div></div>';
    }else{
      h+='<div class="field"><label>Service</label><div class="input val">'+it.svc+'</div></div><div class="field"><label>Pipe size</label><div class="presets"><span'+(it.size==='3 in'?' class="on"':'')+'>3 in</span><span'+(it.size==='4 in'?' class="on"':'')+'>4 in</span><span'+(it.size==='6 in'?' class="on"':'')+'>6 in</span></div></div>';
      h+='<div class="field" style="margin:0"><label>Ends</label><div class="kv"><span class="k">From</span><span style="display:flex;gap:6px;align-items:center"><svg width="10" height="10"><rect width="10" height="10" fill="var(--neutral-90)"/></svg>'+it.from+' - snapped</span></div><div class="kv"><span class="k">To</span><span style="display:flex;gap:6px;align-items:center"><svg width="10" height="10"><rect width="10" height="10" fill="var(--neutral-90)"/></svg>'+it.to+' - snapped</span></div><div class="kv"><span class="k">Length</span><span>'+it.len+'</span></div></div></div>';
    }
  }else if(S.tab==='style'){
    h+='<div class="sect"><div class="note">Style comes from the <b>'+k.label+'</b> kind and applies to all '+k.n+'. Changes here apply to '+it.id+' only and are marked <span class="tag ovr">Override</span>.</div></div>';
    if(it.x){
      h+='<div class="sect"><h4>Icon <span class="tag">From kind</span></h4><div style="display:flex;gap:10px;align-items:center"><span class="pv"><span class="disc">'+ic(k.icon,19)+'</span></span><span class="small muted">'+k.label+' icon from zoom 14, neutral dot below</span></div></div>';
      h+='<div class="sect"><h4>Size <span class="tag">From kind</span></h4><div class="presets"><span>Small</span><span class="on">Standard</span><span>Large</span></div></div>';
      h+='<div class="sect"><h4>Label <span class="tag ovr">Override <button class="btn ghost sm" style="height:16px;padding:0 0 0 4px;color:inherit">Reset</button></span></h4><div class="kv"><span class="k">Shows</span><div class="presets"><span class="on">Name</span><span>Name and key value</span></div></div><div class="kv"><span class="k">Position</span><div class="presets"><span>Below</span><span class="on">Right</span></div></div></div>';
      h+='<div class="sect"><h4>Style rule <span class="tag">From kind</span></h4><div class="kv"><span class="k">States on Status</span><span>Now: <b>Running</b> - Normal</span></div><button class="btn sm" data-act="rail" data-v="kinds">Edit the kind\'s rule</button></div>';
    }else{
      h+='<div class="sect"><h4>Line <span class="tag">From kind</span></h4><div class="kv"><span class="k">Weight</span><div class="presets"><span>Thin</span><span'+(it.size!=='6 in'?' class="on"':'')+'>By pipe size</span><span>Heavy</span></div></div><div class="kv"><span class="k">Pattern</span><div class="presets"><span class="on">Solid</span><span>Dashed</span><span>Dotted</span></div></div></div>';
      h+='<div class="sect"><h4>Label <span class="tag">From kind</span></h4><div class="presets"><span class="on">Name at midpoint</span><span>None</span></div></div>';
    }
    h+='<div class="sect tiny muted">Styles are presets from the project theme. Alarm always wins over style.</div>';
  }else{
    h+='<div class="sect"><h4>Asset</h4>'+(it.asset?'<div class="input val">'+ic('link',15)+it.asset+'</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm">Change</button><button class="btn sm ghost">Unlink</button></div>':'<div class="note" style="display:flex;gap:6px;align-items:center">'+ic('link',14)+'Not linked. Pick an asset to show live values.</div><button class="btn sm pri" style="margin-top:8px">Link to an asset</button>')+'</div>';
    h+='<div class="sect"><h4>Page link <span class="tag">From kind</span></h4><div class="input val small">/'+(it.kind==='pad'?'pad':'site')+'/{asset.id}</div><div class="tiny muted" style="margin-top:4px">Opens /'+(it.kind==='pad'?'pad':'site')+'/'+it.id+'</div></div>';
    h+='<div class="sect"><h4>View alarms <span class="tag">From kind</span></h4><div class="input val small">/alarms?source={asset.path}</div><div class="tiny muted" style="margin-top:4px">Shown in the popup only while '+it.id+' has alarms</div></div>';
    h+='<div class="sect"><h4>Popup parts <span class="tag">From kind</span></h4>'+['Name and kind','Comms','Key values','Alarm summary','Buttons'].map(function(p){return '<div class="kv" style="justify-content:flex-start;gap:8px"><span class="check on">'+ic('check',11)+'</span>'+p+'</div>';}).join('')+'</div>';
  }
  return h;
}
function detailsFoot(){return '<div class="pfoot"><button class="btn sm">'+ic('copy',14)+'Add another like this</button><button class="btn sm ghost" style="margin-left:auto">'+ic('trash',14)+'Delete</button></div>';}

function kindBody(){
  var h='<div class="sect"><h4>Icon</h4><div style="display:flex;gap:8px">';
  ['well-pad','wellhead','point'].forEach(function(n,i){h+='<span class="pv" style="width:auto"><span class="disc" style="'+(i===0?'box-shadow:0 0 0 2px var(--neutral-10),0 0 0 4px var(--neutral-90)':'')+'">'+ic(n,19)+'</span></span>';});

  });

  h+='<div class="sect"><h4>Popup parts</h4>'+[['Name and kind',1],['Comms',1],['Key values',1],['Alarm summary and View alarms',1],['Open pad page',1],['Custom view',0]].map(function(p){return '<div class="kv" style="justify-content:flex-start;gap:8px"><span class="check'+(p[1]?' on':'')+'">'+(p[1]?ic('check',11):'')+'</span>'+p[0]+'</div>';}).join('')+'</div>';

  h+='<div class="tiny muted" style="display:grid;grid-template-columns:1fr 18px 1fr 64px;gap:8px"><span>When Status is</span><span></span><span>Use preset</span><span>Preview</span></div>';
  [['Running','Normal','',''],['Shut in','Dimmed dashed','dim','Shut in'],['Testing','Attention','att','Testing']].forEach(function(r){
    h+='<div class="rule"><span class="input val small" style="height:30px">'+r[0]+'</span><span class="muted">'+ic('chevr',14)+'</span><span class="sel-like">'+r[1]+ic('chev',14)+'</span>'+pvState(r[2],r[3])+'</div>';

/* ---------- directions ---------- */
function dirA(){
  var narrow=S.w<1400, lw=narrow?256:280, pw=narrow?320:340;
  var h=railEl(false);
  var list='', props='';
  var head='<div class="ph"><div class="row"><h3 style="flex:1">Mesa map</h3>'+saveEl()+'</div></div>';
  if(S.rail==='items'){list=head+'<div class="pbody">'+listBody()+'</div>'+listFoot();
    var it=item(S.sel); if(it)props=detailsHead(it,false,true)+'<div class="pbody">'+detailsBody(it)+'</div>'+detailsFoot();}
  else if(S.rail==='kinds'){list=head+'<div class="pbody">'+kindsList()+'</div>'; props=kindHead(false)+'<div class="pbody">'+kindBody()+'</div>';}
  else if(S.rail==='layers'){list=head+'<div class="pbody">'+layersBody()+'</div>';}
  else {list=head+'<div class="pbody">'+importBody()+'</div>';}
  h+='<div class="panel" style="width:'+lw+'px">'+list+'</div>';
  if(props)h+='<div class="panel" style="width:'+pw+'px">'+props+'</div>';
  h+='<div class="map">'+mapWorld(props?-60:0)+toolbarTop()+topRight(false)+overlays()+conflictCard('top:60px;left:16px')+'</div>';
  return h;
}
function dirB(){
  var h='<div style="position:relative;display:flex;flex:1;min-width:0">'+railEl(true);
  var open=S.panel&&S.rail!=='view', pane='';
  if(S.rail==='items'){var it=S.sel&&item(S.sel); pane=it?detailsHead(it,true,true)+'<div class="pbody">'+detailsBody(it)+'</div>'+detailsFoot():titled('Items',listBody(),listFoot(),'<button class="ibtn" data-act="close" title="Close">'+ic('x',18)+'</button>');}
  else if(S.rail==='kinds'){pane=S.kindSel?kindHead(true)+'<div class="pbody">'+kindBody()+'</div>':titled('Kinds',kindsList());}
  else if(S.rail==='layers')pane=titled('Layers',layersBody(),'','<button class="ibtn" data-act="close">'+ic('x',18)+'</button>');
  else pane=titled('Import and export',importBody(),'','<button class="ibtn" data-act="close">'+ic('x',18)+'</button>');
  h+='<div class="map">'+mapWorld(open?160:0)+toolbarTop('<span class="div"></span>'+saveEl())+topRight(false)+overlays()+conflictCard('top:60px;left:50%;transform:translateX(-50%)')+
     (open?'':'<button class="float btn" style="left:12px;bottom:12px" data-act="open">'+ic('list',16)+'Items 11</button>')+'</div>';
  h+='<div class="slide'+(open?'':' closed')+'" style="left:56px">'+pane+'</div></div>';
  return h;
}
function dirC(){
  var narrow=S.w<1400, lw=narrow?240:264, pw=narrow?300:330;
  var tabs=[['items','Items'],['kinds','Kinds'],['layers','Layers'],['import','Import']];
  var left='<div class="ph"><div class="row"><h3 style="flex:1">Mesa map</h3>'+saveEl()+'</div><div class="tabs">'+tabs.map(function(t){return '<button class="'+(S.rail===t[0]?'on':'')+'" data-act="rail" data-v="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div></div>';
  var body={items:listBody(),kinds:kindsList(),layers:layersBody(),import:importBody()}[S.rail]||listBody();
  left+='<div class="pbody">'+body+'</div>'+(S.rail==='items'?listFoot():'');
  var right;
  if(S.rail==='kinds')right=kindHead(false)+'<div class="pbody">'+kindBody()+'</div>';
  else {var it=item(S.sel); right=it?detailsHead(it,false,false)+'<div class="pbody">'+detailsBody(it)+'</div>'+detailsFoot():
    '<div class="ph"><h3>Mesa</h3><div class="small muted">Nothing selected</div></div><div class="pbody"><div class="sect"><h4>Field</h4><div class="kv"><span class="k">Items</span><span>11</span></div><div class="kv"><span class="k">Unlinked</span><span>1 - P12 lateral</span></div><div class="kv"><span class="k">In alarm</span><span class="st a1">'+fi('a1u',14)+'1 - P14</span></div><div class="kv"><span class="k">Comms lost</span><span>1 - P21</span></div><div class="kv"><span class="k">Stale</span><span>1 - SWD1</span></div></div><div class="empty">Select an item on the map or in the list to edit it.</div></div>';}
  return '<div class="panel" style="width:'+lw+'px">'+left+'</div><div class="map">'+mapWorld(0)+strip()+topRight(false)+overlays()+conflictCard('top:60px;left:70px')+'</div><div class="panel right" style="width:'+pw+'px">'+right+'</div>';
}

/* ---------- top-level render ---------- */
function render(){
  var sw='<b>Map Studio - layout directions</b>';
  sw+='<span class="seg">'+['A','B','C'].map(function(d){return '<button class="'+(S.dir===d?'on':'')+'" data-act="dir" data-v="'+d+'">Direction '+d+'</button>';}).join('')+'</span>';
  sw+='<span class="seg">'+[1440,1366].map(function(w){return '<button class="'+(S.w===w?'on':'')+'" data-act="w" data-v="'+w+'">'+w+'</button>';}).join('')+'</span>';
  sw+='<span class="seg">'+[['0','View mode'],['1','Edit mode']].map(function(x){return '<button class="'+((S.edit?'1':'0')===x[0]?'on':'')+'" data-act="setedit" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</span>';
  sw+='<span class="lbl">Save status demo</span><span class="seg">'+[['saved','Saved'],['saving','Saving...'],['conflict','Conflict']].map(function(x){return '<button class="'+(S.save===x[0]?'on':'')+'" data-act="setsave" data-v="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</span>';
  document.getElementById('sw').innerHTML=sw;
  var d=DIRS[S.dir];
  document.getElementById('rat').innerHTML='<h2>'+d.name+'</h2><p>'+d.why+'</p><div class="hint">Try: the Edit switch on the map; a site or line on the map or in the list; the Details, Style and Link tabs; the line tool (snapping hint and Finish or Cancel); Kinds for the Well pad setup; zoom out below 14 for dots; the save status to cycle Saved, Saving... and the conflict.</div>';
  var fr=document.getElementById('frame');
  fr.style.width=S.w+'px'; fr.style.height=(S.w===1440?900:768)+'px';
  var comp=S.edit?(S.dir==='A'?dirA():S.dir==='B'?dirB():dirC()):viewMap();
  fr.innerHTML='<div class="host"><span class="crumb">Fields / <b>Mesa</b> / Map</span><span class="who">Jordan - map editor</span></div><div class="comp">'+comp+'</div><div class="appbar" title="Perspective App Bar toggle">'+ic('chev',12)+'App</div>';
}
var timer=null;
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){var m=e.target.closest('.map');if(m&&S.edit&&placing()){place(m,e);}return;}
  var a=t.getAttribute('data-act'), v=t.getAttribute('data-v'), id=t.getAttribute('data-id');
  switch(a){
    case 'dir':S.dir=v;S.panel=true;break;
    case 'w':S.w=+v;break;
    case 'edit':S.edit=!S.edit;S.drawing=false;if(S.edit&&S.rail==='view')S.rail='items';break;
    case 'setedit':S.edit=v==='1';if(S.edit&&S.rail==='view')S.rail='items';break;
    case 'setsave':S.save=v;S.conflictOpen=v==='conflict';break;
    case 'rail':if(v==='view'){S.edit=false;S.rail='items';}else{S.rail=v;S.panel=true;if(v==='kinds'&&S.dir==='B')S.kindSel=null;}S.drawing=false;break;
    case 'sel':if(S.drawing)return; if(S.edit){S.sel=id;S.rail='items';S.panel=true;}else{S.popup=item(id)&&item(id).x?id:null;}break;
    case 'close':if(S.dir==='B'&&S.rail==='items'&&!S.sel){S.panel=false;}else if(S.dir==='B'&&S.rail!=='items'){S.panel=false;}else S.sel=null;break;
    case 'back':if(S.rail==='kinds')S.kindSel=null;else S.sel=null;break;
    case 'open':S.panel=true;break;
    case 'tab':S.tab=v;break;
    case 'kind':S.kindSel=v;break;
    case 'filter':S.filter=v;break;
    case 'sortopen':S.sortOpen=!S.sortOpen;break;
    case 'sort':S.sort=v;S.sortOpen=false;break;
    case 'tool':S.tool=v;S.drawing=v==='line'||v==='pipe';S.toast=false;break;
    case 'dcancel':S.drawing=false;S.tool='select';break;
    case 'dfinish':S.toastMsg=S.tool==='pipe'?'Pipeline "L-3 (new)" added and saved':'Line added and saved - pick its kind in Details';S.drawing=false;S.tool='select';S.save='saving';S.toast=true;clearTimeout(timer);timer=setTimeout(function(){S.save='saved';render();},1200);break;
    case 'toastx':S.toast=false;break;
    case 'save':S.save=S.save==='saved'?'saving':'conflict';S.conflictOpen=S.save==='conflict';break;
    case 'conflict':S.conflictOpen=!S.conflictOpen;break;
    case 'resolve':S.save='saving';S.conflictOpen=false;clearTimeout(timer);timer=setTimeout(function(){S.save='saved';render();},1000);break;
    case 'zin':S.zoom=Math.min(18,S.zoom+1);break;
    case 'zout':S.zoom=Math.max(10,S.zoom-1);break;
    case 'pclose':S.popup=null;break;
    case 'legend':S.legend=!S.legend;break;
    default:return;
  }
  render();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.drawing){S.drawing=false;S.tool='select';render();}});
function place(m,e){
  var w=m.querySelector('.world').getBoundingClientRect();
  var k=S.tool==='point'?'none':S.tool; S.newN++;
  var nm=k==='pad'?'New well pad':k==='ctb'?'New tank battery':'New point';
  var it={id:nm+(S.newN>1?' '+S.newN:''),kind:k,x:Math.round(e.clientX-w.left),y:Math.round(e.clientY-w.top)-10,ll:'32.2342, -103.8650',kvn:'',kv:'',status:'',comms:'',isNew:true};
  ITEMS.push(it); S.sel=it.id; S.tab='details'; S.rail='items'; S.panel=true; S.tool='select'; S.save='saving';
  clearTimeout(timer);timer=setTimeout(function(){S.save='saved';render();},900); render();
}
var drag=null;
document.addEventListener('mousedown',function(e){var b=e.target.closest('.mk.new');if(!b||!S.edit)return;drag={it:item(b.getAttribute('data-id')),el:b,x:e.clientX,y:e.clientY,ox:0,oy:0};e.preventDefault();});
document.addEventListener('mousemove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.el.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';drag.dx=dx;drag.dy=dy;});
document.addEventListener('mouseup',function(){if(!drag)return;if(drag.dx||drag.dy){drag.it.x+=drag.dx||0;drag.it.y+=drag.dy||0;S.save='saving';clearTimeout(timer);timer=setTimeout(function(){S.save='saved';render();},800);}drag=null;render();});
window.ITEMS=ITEMS;window.place=place;
window.S=S;window.render=render;
render();
</script>
</body>
</html>
