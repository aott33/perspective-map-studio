# Local development Gateway for Map Studio.
#
# A disposable Ignition 8.3.10 Gateway in Docker. DEVELOPMENT ONLY: it accepts
# the EULA automatically, generates a local admin password and loads unsigned
# modules. Never use this configuration in production.
#
# Drive it with the scripts beside this file (up.sh, down.sh, logs.sh).

services:
  # One-shot volume prep: on a brand-new volume Docker would create the project
  # bind mount's parent (data/projects/) as root and the Gateway would then fault
  # with "unable to create resource dir". Hand the directory to the ignition user
  # before the Gateway ever starts. Idempotent.
  init:
    image: inductiveautomation/ignition:8.3.10
    user: root
    entrypoint:
      - sh
      - -c
      - mkdir -p /usr/local/bin/ignition/data/projects
        && chown ignition:ignition /usr/local/bin/ignition/data/projects
    volumes:
      - gateway-data:/usr/local/bin/ignition/data
    restart: "no"

  gateway:
    image: inductiveautomation/ignition:8.3.10
    container_name: mapstudio-ignition
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      # Host port from .env (GATEWAY_HTTP_PORT); the Gateway listens on 8088 inside.
      # Bound to 127.0.0.1 only: the dev Gateway is never reachable from outside this machine.
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-9088}:8088"
    environment:
      # Accept the Inductive Automation licence agreement (required to start).
      ACCEPT_IGNITION_EULA: "Y"
      # Initial Gateway admin credentials. The password comes from the git-ignored
      # .env that ops/lib.sh generates; it is never committed.
      GATEWAY_ADMIN_USERNAME: "admin"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD:?run the ops/ scripts, which generate it into .env}"
      # "standard" edition includes Perspective (trial mode without a licence).
      IGNITION_EDITION: "standard"
      # Unattended acceptance of the staged module's licence and (absent)
      # certificate, so a fresh Gateway never parks in commissioning.
      ACCEPT_MODULE_LICENSES: "com.aoindustrial.perspective.mapstudio"
      ACCEPT_MODULE_CERTS: "com.aoindustrial.perspective.mapstudio"
      TZ: "${GATEWAY_TZ:-UTC}"
    volumes:
      # Gateway state across restarts (removed by down.sh --purge).
      - gateway-data:/usr/local/bin/ignition/data
      # Third-party module folder: up.sh stages the freshly built .modl here.
      - ./modules:/external-modules
      # The committed dev project, mounted in so a browser session can render it.
      # Designer saves write straight back into the repo.
      - ./project:/usr/local/bin/ignition/data/projects/mapstudio-dev
    # Everything after "--" goes to the JVM.
    #   externalModulesFolder: where the Gateway looks for third-party modules.
    #   allowunsignedmodules: load the unsigned dev build (dev Gateway only).
    command:
      - "-n"
      - "mapstudio-dev"
      - "--"
      - "-Dignition.gateway.externalModulesFolder=/external-modules"
      - "-Dignition.allowunsignedmodules=true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/StatusPing"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # No restart policy: a disposable dev Gateway should not come back on its own.
    restart: "no"

volumes:
  gateway-data:
