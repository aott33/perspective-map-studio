# Local development Gateway for Map Studio.
#
# A disposable Ignition 8.3.10 Gateway in Docker. DEVELOPMENT ONLY: it accepts
# the EULA automatically, generates a local admin password and loads unsigned
# modules. Never use this configuration in production.
#
# Drive it with the scripts beside this file (up.sh, down.sh, logs.sh).

#
# The map store: PostgreSQL 16 beside the Gateway on the compose project's own
# network (reached as "postgres", no host port). Its password is generated by
# ops/lib.sh into the git-ignored ops/secrets/ and reaches both containers as a
# Docker secret; the Gateway reads it only through its File secret provider
# MapStudioFiles (ops/config/core), so no password is in any committed file.

services:
  # One-shot volume prep, run before every start:
  # - On a brand-new volume Docker would create the project bind mount's parent
  #   (data/projects/) as root and the Gateway would then fault with "unable to
  #   create resource dir". Hand the directory to the Gateway's user first: the
  #   developer's uid and gid (IGNITION_UID / IGNITION_GID from .env, see the
  #   gateway service), which also re-owns a volume made before that mapping.
  #   Only the volume is mounted here, never ops/project. (The Gateway's own
  #   entrypoint does re-own, on each container creation, whatever under its
  #   install folder is not IGNITION_UID:IGNITION_GID, the bind-mounted
  #   projects included, so those ids must be the developer's own: then the
  #   repository's files are already theirs and nothing changes.)
  # - On a fresh volume, seed the core config collection from ops/config/core
  #   (config-mode.json included: a pre-filled core without it faults the
  #   Gateway). Copied, not bind-mounted, so the Gateway owns the files and
  #   nothing is written back into the repository. An existing core is kept.
  # - Every start: copy the generated dev API key resource (ops/secrets/core,
  #   git-ignored; it holds only the key's SHA-256 hash) into core, so the key
  #   ops/users.py uses matches the one in ops/secrets/api-token.
  init:
    image: inductiveautomation/ignition:8.3.10
    user: root
    entrypoint:
      - sh
      - -c
      - mkdir -p /usr/local/bin/ignition/data/projects /usr/local/bin/ignition/data/config/resources
        && if [ ! -f /usr/local/bin/ignition/data/config/resources/core/config-mode.json ]; then
        mkdir -p /usr/local/bin/ignition/data/config/resources/core
        && cp -R /ops-config/core/. /usr/local/bin/ignition/data/config/resources/core/; fi
        && cp -R /ops-secrets/core/. /usr/local/bin/ignition/data/config/resources/core/
        && chown -R ${IGNITION_UID:-2003}:${IGNITION_GID:-2003} /usr/local/bin/ignition/data/projects /usr/local/bin/ignition/data/config
    volumes:
      - gateway-data:/usr/local/bin/ignition/data
      - ./config:/ops-config:ro
      - ./secrets/core:/ops-secrets/core:ro
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: ${MAPSTUDIO_CONTAINER:?run the ops/ scripts, which set it in .env}-pg
    environment:
      POSTGRES_DB: mapstudio
      POSTGRES_USER: mapstudio
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Run once on a fresh volume: the store checks' database and role (epic 2 story 5,
      # ops/store-checks.sh); harmless for the plain stack, which never uses them.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: the image's temporary init-time server listens on
      # the unix socket only, so a socket probe says healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mapstudio -d mapstudio"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: "no"

  gateway:
    image: inductiveautomation/ignition:8.3.10
    # Overridable so several dev Gateways can run side by side (one per worktree).
    container_name: ${MAPSTUDIO_CONTAINER:?run the ops/ scripts, which set it in .env}
    # Started as root so the image's entrypoint can remap its ignition user to
    # IGNITION_UID:IGNITION_GID (the developer's own ids, written into .env by
    # ops/lib.sh), re-own the install and the data volume, and step down to that
    # user with gosu before the Gateway starts [live 8.3.10]. The dev project is
    # bind-mounted from ops/project, owned by the developer, so the Gateway must
    # run as the developer to write a Designer save back; as the image's own
    # user 2003 every save failed ("PushException: I/O error during prepare").
    # With a root checkout (uid 0) the entrypoint keeps running as root.
    user: root
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    secrets:
      - pg_password
      # The dev map's basemap token (epic 3 entry 6): a generated placeholder, read by the Gateway's
      # MapStudioFiles secret provider when a browser picks the Satellite basemap; never a real token in git.
      - map_token
    ports:
      # Host port from .env (GATEWAY_HTTP_PORT); the Gateway listens on 8088 inside.
      # Bound to 127.0.0.1 only: the dev Gateway is never reachable from outside this machine.
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-9088}:8088"
    environment:
      # Accept the Inductive Automation licence agreement (required to start).
      ACCEPT_IGNITION_EULA: "Y"
      # Initial Gateway admin credentials. The password comes from the git-ignored
      # .env that ops/lib.sh generates; it is never committed.
      GATEWAY_ADMIN_USERNAME: "admin"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD:?run the ops/ scripts, which generate it into .env}"
      # "standard" edition includes Perspective (trial mode without a licence).
      IGNITION_EDITION: "standard"
      # Unattended acceptance of the staged module's licence and (absent)
      # certificate, so a fresh Gateway never parks in commissioning.
      ACCEPT_MODULE_LICENSES: "com.aoindustrial.perspective.mapstudio"
      ACCEPT_MODULE_CERTS: "com.aoindustrial.perspective.mapstudio"
      TZ: "${GATEWAY_TZ:-UTC}"
      # The developer's uid and gid (see "user: root" above). Both are needed:
      # the entrypoint refuses one without the other.
      IGNITION_UID: "${IGNITION_UID:-2003}"
      IGNITION_GID: "${IGNITION_GID:-2003}"
    volumes:
      # Gateway state across restarts (removed by down.sh --purge).
      - gateway-data:/usr/local/bin/ignition/data
      # Third-party module folder: up.sh stages the freshly built .modl here.
      - ./modules:/external-modules
      # The committed dev project, mounted in so a browser session can render it.
      # Designer saves write straight back into the repo.
      - ./project:/usr/local/bin/ignition/data/projects/mapstudio-dev
      # The showcase project (epic 3 entry 15): the component alone on the mockups' demo field, seeded
      # from the dev project's /edit page ("Seed the dev map" seeds both maps).
      - ./showcase/project:/usr/local/bin/ignition/data/projects/mapstudio-showcase
    # Everything after "--" goes to the JVM.
    #   externalModulesFolder: where the Gateway looks for third-party modules.
    #   allowunsignedmodules: load the unsigned dev build (dev Gateway only).
    command:
      - "-n"
      - "mapstudio-dev"
      - "--"
      - "-Dignition.gateway.externalModulesFolder=/external-modules"
      - "-Dignition.allowunsignedmodules=true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/StatusPing"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # No restart policy: a disposable dev Gateway should not come back on its own.
    restart: "no"

secrets:
  pg_password:
    file: ./secrets/pg_password
  map_token:
    file: ./secrets/map_token

volumes:
  gateway-data:
  postgres-data:
